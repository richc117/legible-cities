[project]
name = "openschematicmaps"
version = "0.8.0"
description = "Schematic transit maps from open data (GTFS + OpenStreetMap)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# What src/schematic imports: pandas (feeds, schedule), requests (feeds) and
# python-lsp-jsonrpc (serve). geopandas, shapely and networkx were declared
# and never imported; the notebooks and their plotting are an optional group,
# as are the tests (jsonschema checks the protocol there, never at runtime).
dependencies = [
    "pandas>=2.2",
    "python-lsp-jsonrpc>=1.1",
    "requests>=2.32",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8",
    "pillow>=10",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schematic"]

[tool.ruff]
line-length = 100
