<script>
  // Applied before paint so the page never flashes the wrong theme. Shares the
  // rc-theme key with the rest of the site.
  //
  // The URL wins over localStorage, and is read first: an export runs from a
  // file:// URL, where reading localStorage can throw outright, and a capture
  // cannot afford to spend frame 1 in the wrong palette.
  (function () {
    var q = new URLSearchParams(location.search);
    var theme = q.get("theme");
    if (!theme) {
      try { theme = localStorage.getItem("rc-theme"); } catch (e) {}
    }
    if ((theme || "warm-dark") === "sepia") {
      document.documentElement.setAttribute("data-theme", "sepia");
    }
    // Present mode is a document-level flag so the stylesheet can act on it
    // before any script runs, rather than reformatting a painted page.
    if (q.get("present") === "1") {
      document.documentElement.setAttribute("data-present", "");
    }
  })();

  input[type=range] {
    flex: 1 1 12rem; min-width: 8rem; max-width: 26rem; accent-color: var(--text);
  }

  /* Secondary controls: everything you touch once a session rather than once a
     minute. Open by default where there is room, folded away on a phone. */
  #more-panel { margin-top: 0.55rem; }
  #more-panel[hidden] { display: none; }
  .panel-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 1.4rem;
    padding: 0.4rem 0 0.2rem;
  }
  /* Clusters stay together when the row wraps, so "All / None" never ends up
     orphaned from the word Lines. */
  .panel-group {
    display: inline-flex; align-items: center; gap: 0.6rem;
  }
  .panel-label { color: var(--muted); font-size: 0.86rem; }

    user-select: none; font-size: 0.86rem; color: var(--muted);
  }
  .chip:hover { color: var(--text); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip[aria-pressed="true"] { color: var(--text); }
  .chip[aria-pressed="false"] .dot { opacity: 0.3; }
  .sort { color: var(--muted); font-size: 0.86rem; display: inline-flex;
          align-items: center; gap: 0.45rem; }
  .sort[hidden] { display: none; }

  /* The stage scrolls, not the page. The inset edge shading is the only hint
     that there is more chart to the right, so it is worth the two lines. */
  #stage {
    padding: 1.4rem; overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  #stage.scrollable-right {
    -webkit-mask-image: linear-gradient(to right, #000 92%, rgba(0,0,0,0.35));
            mask-image: linear-gradient(to right, #000 92%, rgba(0,0,0,0.35));
  }
  /* Row labels in the linear view's gutter, in each line's own colour. */
  .rowname { font-weight: 700; font-size: 13px; dominant-baseline: middle; }
  /* Width is set by the script, which is the only thing that knows the view:
     the map wants to fill the height and pan, while the rows want a legible
     column width and let the page scroll. A CSS rule cannot tell them apart,
     and the one that used to try pinned the width to 100% and killed the
     panning it was meant to enable. */
  svg { display: block; height: auto; }
  /* Painted behind the glyph so a train reads against its own line colour. */
  /* The fallback matters: lifted out of this page and rendered standalone --
     an <img>, or rsvg-convert -- an unresolved var() paints black rather than
     nothing, so every train would grow a black halo. */
  .train { paint-order: stroke; stroke: var(--train-halo, #15120f); stroke-width: 1.6; }
  @media (max-width: 700px) {
    html, body { font-size: 17px; }
    /* Two rows, not four. The toolbar was taking a third of the screen before
       anything of the map appeared. */
    header { padding: 0.35rem 0.7rem; }
    /* nowrap, deliberately: a wrapping flex line wraps *before* it shrinks, so
       with wrap on the title never truncates and the view switcher drops to a
       row of its own. Everything here can shrink -- the title to an ellipsis,
       the scrubber to a stub -- so one line is always reachable. */
    .bar { gap: 0.2rem 0.7rem; flex-wrap: nowrap; }
    .bar + .bar { margin-top: 0.1rem; }
    h1 { font-size: 0.95rem; }
    .clock { font-size: 1rem; min-width: 4.6ch; }
    /* The service date is on the atlas entry that got you here. */
    .sub:not(#count) { display: none; }
    #count { font-size: 0.78rem; }
    #count::after { content: none; }

  /* Both platforms ask for 44px. Scoped to touch so the desktop toolbar keeps
     its density. */
  @media (pointer: coarse) {
    button, .chip, .back {
      min-height: 44px; display: inline-flex; align-items: center;
    }
    input[type=range] { height: 44px; }

    /* The switcher is already icons everywhere; on touch each one grows to the
       44px square both platforms ask for. Four of those is 176px of a 390px
       screen, in a header that has to stay under 15% of the viewport --
       bin/measure-mobile is the check on that. */
    .segmented button { min-width: 44px; width: 44px; height: 44px; }
  }

  /* Presentation mode: the visualization and nothing else, for export or for
     showing on a screen. The header is *hidden*, never removed -- draw() writes
     to the clock and the train count every frame and would throw without them.
     The backdrop is made transparent so the padded frame reads as one surface:
     in warm-dark --map-bg (#1f1915) is lighter than --bg (#15120f), which is
     the faint card edge visible around the map on the normal page. */
  :root[data-present] header { display: none; }

     nothing else. It returns as a floating overlay rather than as flow content:
     #stage is height:100vh under an overflow:hidden root, so there is no band
     above it left to occupy. Every other child of the header stays
     display:none, which keeps #clock, #count and #scrub in the DOM for draw()
     to write to -- the same reason the header is hidden and not removed.

     Top right is the one free corner: the overlay puts the name top left and
     the clock bottom right, on this same inset, so the three line up. */

    z-index: 12; background: none; border: 0; padding: 0;

  :root[data-present][data-controls] header .bar + .bar,
  :root[data-present][data-controls] #more-panel { display: none; }

  :root[data-present] { --map-bg: transparent; }
  :root[data-present] #stage {
    padding: 0; overflow: hidden; height: 100vh;

  #present-overlay .name span { display: block; color: var(--muted); font-weight: 400; }
  /* The service day the trains below are actually running. Smaller than the

  #present-overlay .name .when { font-size: 0.72em; margin-top: 0.35em; }

  }

  #present-safe div { position: absolute; background: rgba(255,0,80,0.22);

<script>
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  // Declared here rather than beside the view state below: the track and dot
  // builders read it, and they run first.
  const geoData = data.geo || null;
  const svg = document.querySelector("#stage svg");
  const NS = "http://www.w3.org/2000/svg";
  const params = new URLSearchParams(location.search);
  const present = params.get("present") === "1";
  let capture = false;    // true while an exporter is stepping the clock itself
  let shown = 0;          // trains actually drawn last frame; capture asserts on it
  let onDraw = null;      // present mode's overlay, called at the end of draw()
  let rafId = null;       // so a capture can cancel a frame that is already queued
  // Snapping the tweens is right for someone who asked not to be moved, and
  // wrong for a capture, where it would turn every transition into a hard cut.
  const reduced = !present && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------------------------------------------------------- geometry
  const vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  const [vbX, vbY, vbW, vbH] = vb;
  // The generated SVG carries width/height attributes, which fix its intrinsic
  // aspect ratio -- so  would ignore a viewBox that grows for the
  // linear view. CSS sizes the element here, so drop them.
  svg.removeAttribute("width");
  svg.removeAttribute("height");

  // Where each station sits on the map, read back off the drawing rather than
  // shipped a second time in the payload.
  const mapXY = new Map();
  svg.querySelectorAll("#stations circle[data-node]").forEach(c => {
    mapXY.set(c.getAttribute("data-node"), {
      x: +c.getAttribute("cx"), y: +c.getAttribute("cy"), r: +c.getAttribute("r"),
    });
  });

  // The linear layout: one row per line, plus a shallower row per branch.
  const layout = data.linear || { columns: 1, lines: [] };
  // Station names sit above their dot at an angle, so a row needs clear space
  // above it and past its right-hand end or the outermost names get cut off.
  const LABEL_RISE = 112;
  // A row needs this much height for its names to be readable. A network with
  // many lines therefore needs a taller canvas than the map does -- so the
  // linear view grows the viewBox and the page scrolls, the way a list should,
  // rather than crushing 27 rows into the map's frame.
  const ROW_H = 150;
  const nLines = Math.max(layout.lines.length, 1);
  const linH = Math.max(vbH, LABEL_RISE + nLines * ROW_H);
  // The gutter has to hold the widest terminus name the time chart will print
  // there, or the left-hand end of it is sliced off by the viewBox.
  const terminusWidth = (() => {
    let longest = 0;
    for (const line of layout.lines) {
      const spine = (line.rows[0] || {}).nodes || [];
      for (const pair of [spine[0], spine[spine.length - 1]]) {
        const nm = pair && (layout.names || {})[pair[0]];
        if (nm) longest = Math.max(longest, nm.length);
      }
    }
    return longest * 7.0 + 24;      // 11px Palatino runs wide on capitals
  })();
  const GUTTER = Math.max(vbW * 0.075, 74, terminusWidth);
  const RIGHT = Math.max(vbW * 0.02, 96);
  const colW = (vbW - GUTTER - RIGHT) / Math.max(layout.columns - 1, 1);
  const band = (linH - LABEL_RISE) / nLines;
  const branchDrop = Math.min(band * 0.30, 26);

  // Column of every (line, station), and which row of the line it is on.
  const cell = new Map();                       // "label node" -> {col, depth}
  const lineStations = new Map();               // label -> [{node, col, depth}]
  for (const line of layout.lines) {
    const list = [];
    for (const row of line.rows) {
      for (const pair of row.nodes) {
        cell.set(line.label + " " + pair[0], { col: pair[1], depth: row.depth });
        list.push({ node: pair[0], col: pair[1], depth: row.depth });
      }
    }
    lineStations.set(line.label, list);
  }

  // Row order is animated, so a re-sort slides rather than jumps.
  const order = layout.lines.map(l => l.label);
  const rowPos = new Map(order.map((l, i) => [l, i]));
  const rowTarget = new Map(rowPos);

  const linXY = (label, node) => {
    const c = cell.get(label + " " + node);
    if (!c) return null;
    const base = rowPos.get(label) || 0;
    return {
      x: vbX + GUTTER + c.col * colW,
      y: vbY + LABEL_RISE + band * (base + 0.15) + c.depth * branchDrop,
    };
  };

  // A station column narrower than this cannot be read, so on a narrow screen
  // the rows keep their width and the stage scrolls instead of shrinking.
  const MIN_COL_PX = 22;
  const stage = document.querySelector("#stage");

  function sizeStage() {
    if (present) {
      // The box has already been padded to the frame's aspect, so the SVG's own
      // "meet" fit is exact and there is nothing left to compute. Clearing the
      // inline sizes lets the stylesheet's 100%/100% win.
      svg.style.width = "";
      svg.style.height = "";
      stage.classList.remove("scrollable-right");
      return;
    }
    const cs = getComputedStyle(stage);
    const avail = stage.clientWidth
      - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const box = svg.getAttribute("viewBox").split(/\s+/).map(Number);
    const narrow = window.innerWidth <= 900;
    let w = avail;
    if (narrow && mode === "map") {
      // A wide network shrunk to a phone is unreadable: fill the height and
      // let it pan.
      w = Math.max(avail, window.innerHeight * 0.62 * (box[2] / box[3]));
    } else if (narrow) {
      // Rows keep a legible column width; the page takes the vertical scroll.
      w = Math.max(avail, layout.columns * MIN_COL_PX);
    }
    svg.style.width = w.toFixed(0) + "px";
    svg.style.height = "auto";
    stage.classList.toggle("scrollable-right",
                           stage.scrollWidth > stage.clientWidth + 1);
  }

  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ------------------------------------------------------- stringline layout
  // A Marey chart: time across, stops down, every trip a diagonal. It reuses
  // the linear layout's columns as its vertical axis, so a station is at the
  // same position in the sequence in both views -- the row simply stands up.
  const lineWidth = new Map(layout.lines.map(l => [l.label, Math.max(l.stations, 2)]));
  const lineSpan = new Map(layout.lines.map(l => {
    let max = 1;
    for (const row of l.rows) for (const pair of row.nodes) max = Math.max(max, pair[1]);
    return [l.label, max];
  }));

  const bandTop = label => vbY + LABEL_RISE + band * (rowPos.get(label) || 0) + 4;
  const bandInner = () => band * 0.80;

  // Vertical position of a station within its line's band, band-local.
  const stopY = (label, node) => {
    const c = cell.get(label + " " + node);
    if (!c) return null;
    return (c.col / (lineSpan.get(label) || 1)) * bandInner();
  };

  // ------------------------------------------------------------ linear layer
  // An interchange is one dot on the map but appears once per line in the
  // linear view, so stations and labels are rebuilt per (line, station). At
  // m = 0 every instance sits exactly where the map drew it, which makes the
  // swap invisible.
  const backdrop = svg.querySelector("#backdrop");

  // Every write to the viewBox goes through setBox. There were two writers
  // before -- the morph in geometry() and the labels toggle -- and they fought:
  // with labels off, the next dirty frame silently restored the full box.
  // Present mode adds a third concern, padding the box out to an export's
  // aspect ratio, which is only tractable with a single owner.
  const fullBox = svg.getAttribute("viewBox");
  const tightBox = svg.getAttribute("data-viewbox-nolabels");
  let labelsOn = true;
  let frameAspect = 0;    // present mode target w/h; 0 leaves the box alone
  let frameTop = 0.5;     // share of added height taken above the network
  let frameMargin = 0;    // breathing room once the aspect is reached
  let lastBox = vb.slice();
  // Set when only some lines are showing. The drawn box is sized for the whole
  // network, so one line inside it is a thin band across a mostly empty frame
  // -- and every label shrinks with it. Two boxes, not one: the network states
  // and the row state occupy different parts of the canvas, so a single box
  // spanning both leaves each of them floating in the other's space. Lerped by
  // m, exactly as the height already was. See fitVisible().
  let subsetBox = null, subsetLinBox = null;

  function setBox(m) {
    // Tightening onto the network only makes sense for the map: elsewhere the
    // height belongs to the morph and the label overhang is not what sets it.
    const tight = !labelsOn && tightBox && mode === "map";
    // The chart is laid out across the full canvas width, so it keeps the drawn
    // box whatever else is hidden.
    const subset = subsetBox && mode !== "string";
    const base = subset
      ? [0, 1, 2, 3].map(i => lerp(subsetBox[i], subsetLinBox[i], m))
      : (tight ? tightBox : fullBox).split(/\s+/).map(Number);
    let x = base[0], y = base[1], w = base[2], h = base[3];
    // The row-based views are taller than the map; the morph lerps the height.
    // A subset box has already been measured in each state, so it must not be
    // stretched again on top of that.
    if (!subset && linH !== vbH) h = lerp(h, linH, m);

    if (frameAspect > 0) {
      // Grow -- never crop -- to reach the frame's aspect. Cropping a transit
      // map cuts off real stations. The split is deliberately not centred: on
      // a tall frame the added height is the gutter the title and clock live
      // in, and centring would waste it and force them over the network.
      if (w / h < frameAspect) {
        const grow = h * frameAspect - w;
        x -= grow / 2; w += grow;
      } else {
        const grow = w / frameAspect - h;
        y -= grow * frameTop; h += grow;
      }
      // Then hold the whole thing off the edges. Inflating both axes by the
      // same fraction keeps the aspect exactly. This is what stops the title
      // landing on the artwork: a view that fills its frame -- the linear one
      // does, on a tall crop -- otherwise runs a line straight through the
      // city's name.
      if (frameMargin > 0) {
        const mx = w * frameMargin, my = h * frameMargin;
        x -= mx; w += 2 * mx;
        y -= my; h += 2 * my;
      }
    }

    svg.setAttribute("viewBox",
      x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2));
    if (backdrop) {
      // Off the export path, only the height moves -- the normal page has always
      // kept the backdrop at the full box's x/y/width, and matching that keeps
      // this refactor invisible there.
      if (frameAspect > 0) {
        backdrop.setAttribute("x", x.toFixed(2));
        backdrop.setAttribute("y", y.toFixed(2));
        backdrop.setAttribute("width", w.toFixed(2));
      }
      backdrop.setAttribute("height", h.toFixed(2));
    }
    lastBox = [x, y, w, h];
    return lastBox;
  }

  const mapStations = svg.querySelector("#stations");
  const mapLabels = svg.querySelector("#labels");
  const labelSpec = new Map();
  if (mapLabels) {
    mapLabels.querySelectorAll("text[data-node]").forEach(t => {
      labelSpec.set(t.getAttribute("data-node"), {
        text: t.textContent,
        x: +t.getAttribute("x"), y: +t.getAttribute("y"),
        anchor: t.getAttribute("text-anchor") || "start",
        rotate: (t.getAttribute("transform") || "").match(/rotate\(([-\d.]+)/),
      });
    });
  }

  const dotLayer = document.createElementNS(NS, "g");
  const nameLayer = document.createElementNS(NS, "g");
  const textLayer = document.createElementNS(NS, "g");
  dotLayer.setAttribute("id", "linear-stations");
  textLayer.setAttribute("id", "linear-labels");
  nameLayer.setAttribute("id", "linear-names");
  if (mapLabels) {
    textLayer.setAttribute("font-size", mapLabels.getAttribute("font-size") || "11");
    textLayer.setAttribute("fill", mapLabels.getAttribute("fill") || "currentColor");
  }

  const dots = [];      // {el, label, node, mapPt, r}
  const texts = [];     // {el, label, node, spec, primary}
  const names = [];     // {el, label}
  const seenLabel = new Set();

  for (const line of layout.lines) {
    for (const st of lineStations.get(line.label) || []) {
      const pt = mapXY.get(st.node);
      if (!pt) continue;

      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("r", pt.r);
      dot.setAttribute("fill", "var(--map-station-fill, #fff)");
      dot.setAttribute("stroke", "var(--map-station-stroke, #111)");
      dot.setAttribute("stroke-width", "2.2");
      dotLayer.appendChild(dot);
      const gn = geoData && geoData.nodes[st.node];
      dots.push({ el: dot, label: line.label, node: st.node, mapPt: pt, r: pt.r,
                  geoPt: gn ? { x: gn[0], y: gn[1] } : null });

      const name = (layout.names || {})[st.node];
      if (name) {
        const t = document.createElementNS(NS, "text");
        t.textContent = name;
        textLayer.appendChild(t);
        // The map may have had nowhere to put this name. Then there is no
        // m = 0 pose to hold, so park it on the dot and keep it invisible
        // until the rows take over.
        const spec = labelSpec.get(st.node) ||
          { x: pt.x, y: pt.y, anchor: "start", rotate: null, ghost: true };
        // Only one instance per station is opaque on the map, or interchange
        // names would overprint themselves.
        const primary = !spec.ghost && !seenLabel.has(st.node);
        seenLabel.add(st.node);
        texts.push({ el: t, label: line.label, node: st.node, spec: spec, primary: primary });
      }
    }
    const name = document.createElementNS(NS, "text");
    name.setAttribute("class", "rowname");
    name.setAttribute("text-anchor", "end");
    name.setAttribute("fill", data.lines[line.label] || "currentColor");
    name.textContent = line.label;
    nameLayer.appendChild(name);
    names.push({ el: name, label: line.label });
  }

  if (mapStations) mapStations.style.display = "none";
  if (mapLabels) mapLabels.style.display = "none";
  const trainsGroup = svg.querySelector("#trains");
  svg.insertBefore(nameLayer, trainsGroup);
  svg.insertBefore(dotLayer, trainsGroup);
  svg.insertBefore(textLayer, trainsGroup);

  // ------------------------------------------------------------- stringline
  // Each route's trips are concatenated into one path in band-local space, so
  // re-sorting only moves a group transform rather than rebuilding 8,000
  // subpaths. Drawn faintly: where the diagonals crowd, that is frequency.
  const stringLayer = document.createElementNS(NS, "g");
  stringLayer.setAttribute("id", "stringline");
  stringLayer.setAttribute("opacity", "0");
  const stringGroups = new Map();
  const axisLayer = document.createElementNS(NS, "g");
  axisLayer.setAttribute("id", "stringline-axis");

  // ------------------------------------------------------------ track morph
  const tracks = [];
  svg.querySelectorAll("#lines path[data-src]").forEach(el => {
    const label = el.parentNode.getAttribute("data-line");
    const pts = el.getAttribute("d").trim().split(/[ML]\s*/).filter(Boolean)
      .map(p => {
        const xy = p.trim().split(/\s+/).map(Number);
        return { x: xy[0], y: xy[1] };
      });
    // Resampled server-side to this track's own vertex count, so vertex i has
    // a partner. A track with no twin holds its drawn shape and simply stays
    // put while the rest of the network moves.
    const g = geoData && geoData.tracks[el.getAttribute("id")];
    tracks.push({
      el: el, label: label, pts: pts, d0: el.getAttribute("d"),
      gpts: g && g.length === pts.length ? g.map(c => ({ x: c[0], y: c[1] })) : null,
      src: el.getAttribute("data-src"), dst: el.getAttribute("data-dst"),
    });
  });

  const trackD = (t, m, g) => {
    const a = linXY(t.label, t.src), b = linXY(t.label, t.dst);
    const n = t.pts.length - 1;
    if ((!a || !b) && !(g > 0 && t.gpts)) return t.d0;
    let out = "";
    for (let i = 0; i <= n; i++) {
      // Geographic first: it is a variant of the map, and the row layout is
      // then reached from wherever the network currently is.
      let px = t.pts[i].x, py = t.pts[i].y;
      if (g > 0 && t.gpts) {
        px = lerp(px, t.gpts[i].x, g);
        py = lerp(py, t.gpts[i].y, g);
      }
      if (m > 0 && a && b) {
        const f = n === 0 ? 0 : i / n;
        px = lerp(px, lerp(a.x, b.x, f), m);
        py = lerp(py, lerp(a.y, b.y, f), m);
      }
      out += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
    }
    return out;
  };

  // ------------------------------------------------------------------ trains
  const defs = document.createElementNS(NS, "defs");
  const pathEls = data.paths.map(p => {
    const el = document.createElementNS(NS, "path");
    el.setAttribute("d", p.d);
    defs.appendChild(el);
    return el;
  });
  // The geographic twin of each route, for getPointAtLength during the morph.
  // Null where the city was built without geographic geometry, which is most.
  const geoPathEls = data.paths.map(p => {
    if (!p.gd) return null;
    const el = document.createElementNS(NS, "path");
    el.setAttribute("d", p.gd);
    defs.appendChild(el);
    return el;
  });
  svg.appendChild(defs);
  const layer = trainsGroup;

  const trips = data.trips;
  const starts = trips.map(t => t.k[0][0]);
  const ends = trips.map(t => t.k[t.k.length - 1][0]);
  const maxSpan = Math.max.apply(null, trips.map((t, i) => ends[i] - starts[i]));
  const t0 = Math.min.apply(null, starts), t1 = Math.max.apply(null, ends);

  const routes = [...new Set(trips.map(t => t.r))].sort();
  const hidden = new Set();
  const nodes = new Map();

  let now = 7 * 3600, speed = 60, playing = true, last = performance.now();
  // Two tweens rather than one three-way switch: m unfolds the map into rows,
  // s stands those rows up into a time chart. A jump from map to stringline
  // simply runs both at once.
  let view = 0, viewTarget = 0;     // m: 0 = map, 1 = linear rows
  let str = 0, strTarget = 0;       // s: 0 = network, 1 = stringline
  // g: 0 = the schematic map as drawn, 1 = the same network before octi
  // straightened it. A third axis on the same interpolation, not a third
  // renderer -- and it is only ever non-zero on a page built with geo data.
  let geo = 0, geoTarget = 0;
  let mode = "map";                 // map | linear | string
  let dirty = true;

  const clock = document.getElementById("clock");
  const count = document.getElementById("count");
  const scrub = document.getElementById("scrub");
  scrub.min = t0; scrub.max = t1; scrub.value = now;

  const timeX = t =>
    vbX + GUTTER + ((t - t0) / Math.max(t1 - t0, 1)) * (vbW - GUTTER - RIGHT);

  (function buildStringline() {
    const byRoute = new Map();
    for (const trip of trips) {
      const path = data.paths[trip.p];
      let d = "";
      for (let i = 0; i < trip.k.length; i++) {
        const f = trip.k[i][1];
        const lo = Math.min(Math.floor(f), path.nodes.length - 1);
        const hi = Math.min(lo + 1, path.nodes.length - 1);
        const ya = stopY(trip.r, path.nodes[lo]), yb = stopY(trip.r, path.nodes[hi]);
        if (ya === null || yb === null) continue;
        const y = lerp(ya, yb, f - lo);
        d += (d ? "L" : "M") + timeX(trip.k[i][0]).toFixed(1) + " " + y.toFixed(1);
      }
      if (d.indexOf("L") < 0) continue;   // a single point draws nothing
      if (!byRoute.has(trip.r)) byRoute.set(trip.r, []);
      byRoute.get(trip.r).push(d);
    }
    for (const line of layout.lines) {
      const g = document.createElementNS(NS, "g");
      const el = document.createElementNS(NS, "path");
      el.setAttribute("d", (byRoute.get(line.label) || []).join(""));
      el.setAttribute("fill", "none");
      el.setAttribute("stroke", data.lines[line.label] || "#888");
      el.setAttribute("stroke-width", "1.4");
      el.setAttribute("stroke-linecap", "round");
      // Busy lines would otherwise fill in solid; thinning them lets density
      // read as density rather than as a block of colour.
      const busy = (byRoute.get(line.label) || []).length;
      el.setAttribute("opacity", (busy > 400 ? 0.16 : busy > 180 ? 0.28
                                 : busy > 90 ? 0.4 : 0.55).toFixed(2));
      g.appendChild(el);

      // Without the two termini the vertical axis has no reference: you can see
      // that a train is climbing but not what it is climbing towards.
      const spine = line.rows[0] ? line.rows[0].nodes : [];
      if (spine.length > 1) {
        const ends = [spine[0], spine[spine.length - 1]];
        ends.forEach((pair, i) => {
          const nm = (layout.names || {})[pair[0]];
          if (!nm) return;
          const t = document.createElementNS(NS, "text");
          t.setAttribute("x", (vbX + GUTTER - 14).toFixed(1));
          t.setAttribute("y", (i === 0 ? 4 : bandInner() + 4).toFixed(1));
          t.setAttribute("text-anchor", "end");
          t.setAttribute("font-size", "11");
          t.setAttribute("fill", "var(--map-label, #111)");
          t.setAttribute("opacity", "0.6");
          t.textContent = nm;
          g.appendChild(t);
        });
      }

      stringLayer.appendChild(g);
      stringGroups.set(line.label, g);
    }
    // Hour gridlines, so the time axis can actually be read.
    const step = (t1 - t0) > 12 * 3600 ? 3 * 3600 : 3600;
    for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
      const x = timeX(t);
      const tick = document.createElementNS(NS, "line");
      tick.setAttribute("x1", x.toFixed(1)); tick.setAttribute("x2", x.toFixed(1));
      tick.setAttribute("y1", (vbY + LABEL_RISE - 26).toFixed(1));
      tick.setAttribute("y2", (vbY + LABEL_RISE + band * nLines).toFixed(1));
      tick.setAttribute("stroke", "var(--map-label, #111)");
      tick.setAttribute("stroke-width", "0.6");
      tick.setAttribute("opacity", "0.16");
      axisLayer.appendChild(tick);
      const lab = document.createElementNS(NS, "text");
      lab.setAttribute("x", x.toFixed(1));
      lab.setAttribute("y", (vbY + LABEL_RISE - 32).toFixed(1));
      lab.setAttribute("text-anchor", "middle");
      lab.setAttribute("font-size", "13");
      lab.setAttribute("fill", "var(--map-label, #111)");
      lab.setAttribute("opacity", "0.55");
      lab.textContent = String(Math.floor(t / 3600) % 24).padStart(2, "0") + ":00";
      axisLayer.appendChild(lab);
    }
    stringLayer.appendChild(axisLayer);
    // The playhead ties the chart to the clock: it is the same instant the
    // network views are showing.
    const head = document.createElementNS(NS, "line");
    head.setAttribute("id", "playhead");
    head.setAttribute("stroke", "var(--map-label, #111)");
    head.setAttribute("stroke-width", "1.2");
    head.setAttribute("opacity", "0.75");
    stringLayer.appendChild(head);
    svg.insertBefore(stringLayer, trainsGroup);
  })();
  const playhead = svg.querySelector("#playhead");

  const fmt = s => {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return String(h % 24).padStart(2, "0") + ":" + String(m).padStart(2, "0")
         + (h >= 24 ? " +1d" : "");
  };

  // Fractional stop index at time t. Both views read this same number, which
  // is what keeps them in step.
  const stopAt = (keys, t) => {
    let lo = 0, hi = keys.length - 1;
    if (t <= keys[0][0]) return keys[0][1];
    if (t >= keys[hi][0]) return keys[hi][1];
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (keys[mid][0] <= t) lo = mid; else hi = mid;
    }
    const ka = keys[lo], kb = keys[hi];
    return kb[0] === ka[0] ? kb[1] : ka[1] + (kb[1] - ka[1]) * (t - ka[0]) / (kb[0] - ka[0]);
  };

  const lowerBound = t => {
    let lo = 0, hi = starts.length;
    const cutoff = t - maxSpan;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (starts[mid] < cutoff) lo = mid + 1; else hi = mid;
    }
    return lo;
  };

  function geometry(m, sf, g) {
    // Network layers dim as the chart takes over; both are positioned every
    // frame so a re-sort moves them together.
    const networkOpacity = (1 - sf).toFixed(3);
    for (const g of [dotLayer, textLayer, svg.querySelector("#lines")]) {
      if (g) g.setAttribute("opacity", networkOpacity);
    }
    stringLayer.setAttribute("opacity", sf.toFixed(3));
    for (const line of layout.lines) {
      const g = stringGroups.get(line.label);
      if (g) g.setAttribute("transform", "translate(0," + bandTop(line.label).toFixed(1) + ")");
    }
    // Sizes the box and grows the painted background with it -- without that
    // the extra rows would sit on whatever is behind the SVG.
    setBox(m);
    for (const t of tracks) t.el.setAttribute("d", trackD(t, m, g));

    for (const d of dots) {
      const lp = linXY(d.label, d.node);
      if (!lp && !(g > 0 && d.geoPt)) continue;
      let x = d.mapPt.x, y = d.mapPt.y;
      if (g > 0 && d.geoPt) { x = lerp(x, d.geoPt.x, g); y = lerp(y, d.geoPt.y, g); }
      if (m > 0 && lp) { x = lerp(x, lp.x, m); y = lerp(y, lp.y, m); }
      d.el.setAttribute("cx", x.toFixed(1));
      d.el.setAttribute("cy", y.toFixed(1));
      // Interchanges are drawn larger on the map; on a row every stop is a stop.
      d.el.setAttribute("r", lerp(d.r, 3.6, m).toFixed(2));
    }

    for (const t of texts) {
      const lp = linXY(t.label, t.node);
      if (!lp && !(g > 0)) continue;
      // Label boxes are solved against the drawn map, so on the geographic one
      // they are in the wrong place -- but only by however far their station
      // moved. Carrying each label by that offset keeps it attached to its stop
      // instead of fading the names out exactly when a reader wants to read a
      // route along them. Collisions are possible; a figure that shows the
      // geographic view is showing one line, where there are none.
      let sx = t.spec.x, sy = t.spec.y;
      if (g > 0 && geoData) {
        const gp = geoData.nodes[t.node], mp = mapXY.get(t.node);
        if (gp && mp) { sx += (gp[0] - mp.x) * g; sy += (gp[1] - mp.y) * g; }
      }
      const x = lp ? lerp(sx, lp.x + 7, m) : sx;
      const y = lp ? lerp(sy, lp.y - 9, m) : sy;
      const r0 = t.spec.rotate ? +t.spec.rotate[1] : 0;
      const rot = lerp(r0, -55, m);
      t.el.setAttribute("x", x.toFixed(1));
      t.el.setAttribute("y", y.toFixed(1));
      t.el.setAttribute("text-anchor", m > 0.5 ? "start" : t.spec.anchor);
      t.el.setAttribute("transform",
        "rotate(" + rot.toFixed(1) + " " + x.toFixed(1) + " " + y.toFixed(1) + ")");
      t.el.setAttribute("opacity", (t.primary ? 1 : m).toFixed(2));
    }

    sizeStage();
    for (const n of names) {
      const base = rowPos.get(n.label) || 0;
      n.el.setAttribute("x", (vbX + GUTTER - 14).toFixed(1));
      // In the chart a line occupies a whole band, so its name centres on it.
      const rowLine = vbY + LABEL_RISE + band * (base + 0.15);
      const rowBand = bandTop(n.label) + bandInner() / 2;
      n.el.setAttribute("y", lerp(rowLine, rowBand, sf).toFixed(1));
      n.el.setAttribute("opacity", Math.max(m, sf).toFixed(2));
    }
  }

  function draw() {
    const m = ease(view), sf = ease(str), gf = ease(geo);
    if (dirty) { geometry(m, sf, gf); dirty = false; }
    if (sf > 0) {
      const hx = timeX(now);
      playhead.setAttribute("x1", hx.toFixed(1));
      playhead.setAttribute("x2", hx.toFixed(1));
      playhead.setAttribute("y1", (vbY + LABEL_RISE - 24).toFixed(1));
      playhead.setAttribute("y2", (vbY + LABEL_RISE + band * nLines).toFixed(1));
    }

    const alive = new Set();
    shown = 0;
    for (let i = lowerBound(now); i < trips.length; i++) {
      if (starts[i] > now) break;
      if (ends[i] < now) continue;
      const trip = trips[i];
      if (hidden.has(trip.r)) continue;
      const path = data.paths[trip.p];

      const f = stopAt(trip.k, now);
      const lo = Math.min(Math.floor(f), path.stops.length - 1);
      const hi = Math.min(lo + 1, path.stops.length - 1);
      const frac = f - lo;

      let x, y;
      if (m < 1) {
        const el = pathEls[trip.p];
        const len = lerp(path.stops[lo], path.stops[hi], frac);
        const pt = el.getPointAtLength(Math.min(len, el.getTotalLength()));
        x = pt.x; y = pt.y;
        // The same fraction of the same hop, measured along the geographic
        // route instead. Reading the stop index once and placing it twice is
        // what stops a train drifting off its own line mid-morph.
        if (gf > 0 && geoPathEls[trip.p]) {
          const gel = geoPathEls[trip.p];
          const glen = lerp(path.gstops[lo], path.gstops[hi], frac);
          const gp = gel.getPointAtLength(Math.min(glen, gel.getTotalLength()));
          x = lerp(x, gp.x, gf); y = lerp(y, gp.y, gf);
        }
      }
      if (m > 0) {
        const a = linXY(trip.r, path.nodes[lo]), b = linXY(trip.r, path.nodes[hi]);
        if (a && b) {
          const lx = lerp(a.x, b.x, frac), ly = lerp(a.y, b.y, frac);
          x = m < 1 ? lerp(x, lx, m) : lx;
          y = m < 1 ? lerp(y, ly, m) : ly;
        } else if (m >= 1) {
          continue;   // no row for this stop; hide rather than draw a lie
        }
      }
      if (sf > 0) {
        // On the chart a train rides its own diagonal, at the playhead.
        const ya = stopY(trip.r, path.nodes[lo]), yb = stopY(trip.r, path.nodes[hi]);
        if (ya === null || yb === null) { if (sf >= 1) continue; }
        else {
          const sx = timeX(now);
          const sy = bandTop(trip.r) + lerp(ya, yb, frac);
          x = sf < 1 ? lerp(x, sx, sf) : sx;
          y = sf < 1 ? lerp(y, sy, sf) : sy;
        }
      }

      let dot = nodes.get(i);
      if (!dot) {
        dot = document.createElementNS(NS, "circle");
        dot.setAttribute("r", 5);
        dot.setAttribute("class", "train");
        dot.setAttribute("fill", data.lines[trip.r] || "#333");
        const title = document.createElementNS(NS, "title");
        title.textContent = trip.r + (trip.h ? " to " + trip.h : "");
        dot.appendChild(title);
        layer.appendChild(dot);
        nodes.set(i, dot);
      }
      dot.setAttribute("cx", x.toFixed(1));
      dot.setAttribute("cy", y.toFixed(1));
      alive.add(i);
      shown++;
    }
    for (const entry of nodes) {
      if (!alive.has(entry[0])) { entry[1].remove(); nodes.delete(entry[0]); }
    }
    clock.textContent = fmt(now);
    // The word is appended in CSS so a phone can drop it and keep the number.
    count.textContent = shown;
    count.setAttribute("aria-label", shown + (shown === 1 ? " train" : " trains") + " running");
    // Present mode's overlay redraws here rather than on its own rAF loop: a
    // capture steps the clock by hand, and a separate loop would not be
    // guaranteed to run between a step and its screenshot.
    if (onDraw) onDraw();
  }

  // A tween is either the page's own exponential decay -- which feels right
  // under a hand but is asymptotic, settling only when it crosses an epsilon --
  // or, when a duration is set, a linear ramp of known length. Capture needs
  // the second: a beat shorter than the decay's ~130 frames would otherwise be
  // cut off mid-transition. draw() eases the result either way, so the ramp
  // arrives as a cubic in-out rather than as constant motion.
  let viewTween = null, strTween = null, geoTween = null;   // {from, to, t, dur}

  function tween(cur, target, state, dt, rate) {
    if (cur === target) return cur;
    if (state && state.dur > 0) {
      state.t += dt;
      const p = Math.min(state.t / state.dur, 1);
      return state.from + (state.to - state.from) * p;
    }
    const next = cur + (target - cur) * (reduced ? 1 : Math.min(dt * rate, 1));
    return Math.abs(target - next) < 0.001 ? target : next;
  }

  function advance(dt) {
    if (playing) {
      now += dt * speed;
      // Wrapping mid-capture is a hard cut in the middle of a clip; a storyboard
      // is responsible for staying inside the service day.
      if (now > t1) now = present ? t1 : t0;
      scrub.value = now;
    }
    // The view tween and the row tween both mark geometry dirty; once both have
    // settled the per-frame cost drops back to moving the trains.
    if (view !== viewTarget) {
      view = tween(view, viewTarget, viewTween, dt, 3.2);
      if (view === viewTarget) viewTween = null;
      dirty = true;
    }
    if (str !== strTarget) {
      str = tween(str, strTarget, strTween, dt, 3.2);
      if (str === strTarget) strTween = null;
      dirty = true;
    }
    if (geo !== geoTarget) {
      geo = tween(geo, geoTarget, geoTween, dt, 3.2);
      if (geo === geoTarget) geoTween = null;
      dirty = true;
    }
    for (const entry of rowTarget) {
      const label = entry[0], target = entry[1];
      const cur = rowPos.get(label);
      if (cur !== target) {
        const next = reduced ? target : cur + (target - cur) * Math.min(dt * 6, 1);
        rowPos.set(label, Math.abs(target - next) < 0.002 ? target : next);
        dirty = true;
      }
    }
  }

  function frame(ts) {
    const dt = Math.min((ts - last) / 1000, 0.25);
    last = ts;
    advance(dt);
    draw();
    // Capture drives the clock itself, one advance() per emitted frame, so the
    // real-time loop must not also be running.
    rafId = capture ? null : requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- controls
  const playBtn = document.getElementById("play");
  playBtn.onclick = () => {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", String(playing));
  };
  scrub.oninput = () => { now = +scrub.value; draw(); };

  // One button showing the current rate, tapped to cycle. Four buttons for a
  // single value cost four times the width and said no more.
  const SPEEDS = [1, 60, 240, 900];
  let speedIdx = SPEEDS.indexOf(speed);
  if (speedIdx < 0) speedIdx = 1;
  const speedBtn = document.getElementById("speed");
  const showSpeed = () => {
    speed = SPEEDS[speedIdx];
    speedBtn.textContent = speed + "\u00d7";
    speedBtn.title = "Playback speed \u2014 tap to cycle";
  };
  speedBtn.onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; showSpeed(); };
  showSpeed();

  // The secondary controls, open where there is room and folded away on a
  // phone. Same markup either way.
  const moreBtn = document.getElementById("more");
  const morePanel = document.getElementById("more-panel");
  const setMore = open => {
    morePanel.hidden = !open;
    moreBtn.setAttribute("aria-expanded", String(open));
    moreBtn.innerHTML = open ? "Less &#9652;" : "More &#9662;";
    dirty = true;
  };
  moreBtn.onclick = () => setMore(morePanel.hidden);

  const labelsBtn = document.getElementById("labels-toggle");
  // setBox already knows that the tight box only applies to the map, so this is
  // just "recompute the box on the next frame".
  const syncBox = () => { dirty = true; };
  const setLabels = on => {
    labelsOn = on;
    labelsBtn.setAttribute("aria-pressed", String(labelsOn));
    textLayer.style.display = labelsOn ? "" : "none";
    syncBox();
  };
  labelsBtn.onclick = () => setLabels(!labelsOn);

  const sortGroup = document.getElementById("sort-group");
  const viewBtns = {
    map: document.getElementById("view-map"),
    linear: document.getElementById("view-linear"),
    string: document.getElementById("view-string"),
  };
  const geoBtn = document.getElementById("view-geo");
  // A page built without the geographic geometry has nothing to show for that
  // button, and setGeo is a documented no-op there. Drop it rather than leave a
  // control that does nothing.
  if (!geoData) geoBtn.remove();

  // The switcher shows four choices over two axes -- the geographic one is the
  // map view with `geo` raised -- so pressed state is derived from both, and
  // from the *targets*, so a button lights the moment a morph starts rather
  // than when it lands. Called by setMode and by setGeo, which is what keeps
  // the buttons honest no matter which seam moved the page: a click, the
  // present.js sequence, or bin/_record.js driving an export.
  const syncButtons = () => {
    const pressed = (geoData && geoTarget === 1) ? "geo" : mode;
    if (geoData) geoBtn.setAttribute("aria-pressed", String(pressed === "geo"));
    Object.keys(viewBtns).forEach(k =>
      viewBtns[k].setAttribute("aria-pressed", String(pressed === k)));
  };
  // `dur` is only ever passed by a capture, which needs a transition that lands
  // exactly on a frame boundary. A click leaves it undefined and keeps the
  // page's own feel.
  const setMode = (next, dur) => {
    mode = next;
    const nextView = next === "map" ? 0 : 1;
    const nextStr = next === "string" ? 1 : 0;
    viewTween = dur > 0 && nextView !== view ? { from: view, to: nextView, t: 0, dur } : null;
    strTween = dur > 0 && nextStr !== str ? { from: str, to: nextStr, t: 0, dur } : null;
    viewTarget = nextView;
    strTarget = nextStr;
    syncButtons();
    // Station names belong to the network views; the chart has its own axis.
    sortGroup.hidden = next === "map";
    labelsBtn.hidden = next === "string";
    syncBox();
    dirty = true;
  };
  // The geographic axis: the same network before octi straightened it. A
  // no-op, reported as false, on a page built without that geometry.
  //
  // Three ways to be asked, and they are not the same: an explicit duration
  // runs a timed tween (a capture, or a figure morphing on a beat), an explicit
  // *zero* snaps -- which is how present.js sets the opening state and how a
  // capture lands frame 0 -- and an omitted duration eases at the page's own
  // rate, the way setMode does for a click. Collapsing the last two, as this
  // did while nothing but present.js called it, made the toolbar's Geographic
  // button a hard cut across the whole network.
  function setGeo(on, dur) {
    if (!geoData) return false;
    const to = on ? 1 : 0;
    geoTween = dur > 0 && to !== geo ? { from: geo, to: to, t: 0, dur: dur } : null;
    geoTarget = to;
    if (dur === 0) { geo = to; }
    syncButtons();
    dirty = true; draw();
    return true;
  }

  // How long a click takes to land. A timed tween rather than the rate-based
  // ease the axes fall back to: that one is front-loaded, spending half its
  // travel in the first fifth of a second, which is fine for rows sliding a
  // little and reads as a jump cut when the whole network is moving between two
  // different geographies.
  //
  // Shorter than MORPH in present.js, deliberately. That 1.8s belongs to a
  // figure that morphs on its own, on a loop, while a reader takes it in --
  // there, a slow transformation *is* the content. A click is a reader asking
  // for something, and waiting on an answer you already asked for feels slower
  // than watching the same motion unprompted. Same S-curve, less of it.
  const CLICK_MORPH = 1.2;

  // Every button sets both axes: naming a view says where the network is as
  // well as how it is laid out. Both tweens run over the same window, so
  // Geographic -> Linear morphs the two together, which the interpolation in
  // trackD(t, m, g) already handles.
  Object.keys(viewBtns).forEach(k => {
    viewBtns[k].onclick = () => { setGeo(false, CLICK_MORPH); setMode(k, CLICK_MORPH); };
  });
  if (geoData) {
    geoBtn.onclick = () => { setGeo(true, CLICK_MORPH); setMode("map", CLICK_MORPH); };
  }

  // The four public view names, as the URL, the site's switcher and the
  // exporter spell them, mapped onto the two axes. `map` and `schematic` are
  // the same view: the label changed, the key did not, because it is written
  // into every atlas link and every storyboard.
  const showView = (name, dur) => {
    const geoOn = name === "geographic";
    setGeo(geoOn, dur);
    setMode(geoOn ? "map"
          : name === "time" ? "string"
          : name === "schematic" ? "map" : name, dur);
  };
  // What showView would have been passed to reach the state now showing.
  const viewName = () =>
    (geoData && geoTarget === 1) ? "geographic"
      : mode === "string" ? "time" : mode;

  const sortBtns = {
    line: document.getElementById("sort-line"),
    size: document.getElementById("sort-size"),
  };
  const sized = new Map(layout.lines.map(l => [l.label, l.stations]));
  const applySort = how => {
    const sorted = order.slice().sort((a, b) =>
      how === "size" ? (sized.get(b) - sized.get(a)) || a.localeCompare(b)
                     : a.localeCompare(b, undefined, { numeric: true }));
    sorted.forEach((label, i) => rowTarget.set(label, i));
    Object.keys(sortBtns).forEach(k =>
      sortBtns[k].setAttribute("aria-pressed", String(k === how)));
    dirty = true;
  };
  sortBtns.line.onclick = () => applySort("line");
  sortBtns.size.onclick = () => applySort("size");
  applySort("line");
  for (const entry of rowTarget) rowPos.set(entry[0], entry[1]);

  const lines = document.getElementById("line-toggles");
  const lineCount = document.getElementById("line-count");
  const chips = new Map();

  // One place decides what a hidden line means, across all three views.
  const setRoute = (r, on) => {
    if (on) hidden.delete(r); else hidden.add(r);
    const off = on ? "" : "none";
    const chip = chips.get(r);
    if (chip) chip.setAttribute("aria-pressed", String(on));
    svg.querySelectorAll('#lines g.line[data-line="' + r + '"]')
       .forEach(g => g.style.display = off);
    for (const d of dots) if (d.label === r) d.el.style.display = off;
    for (const t of texts) if (t.label === r) t.el.style.display = off;
    for (const n of names) if (n.label === r) n.el.style.display = off;
    const sg = stringGroups.get(r);
    if (sg) sg.style.display = off;
    lineCount.textContent = (routes.length - hidden.size) + " of " + routes.length;
  };

  for (const r of routes) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.setAttribute("role", "button");
    chip.setAttribute("tabindex", "0");
    chip.setAttribute("aria-pressed", "true");
    chip.innerHTML = '<span class="dot" style="background:' +
      (data.lines[r] || "#333") + '"></span>' + r;
    const toggle = () => {
      setRoute(r, chip.getAttribute("aria-pressed") !== "true");
      draw();
    };
    chip.onclick = toggle;
    chip.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    };
    chips.set(r, chip);
    lines.appendChild(chip);
  }
  document.getElementById("lines-all").onclick = () => {
    for (const r of routes) setRoute(r, true);
    draw();
  };
  document.getElementById("lines-none").onclick = () => {
    for (const r of routes) setRoute(r, false);
    draw();
  };
  lineCount.textContent = routes.length + " of " + routes.length;

  setMode("map");
  setMore(window.innerWidth > 900);
  addEventListener("resize", () => { dirty = true; });
  geometry(0, 0, 0);

  // The mechanism an exporter drives. Everything above is closed over inside
  // this IIFE, so a second <script> cannot reach it; this object is the only
  // seam. It is deliberately mechanism, not policy -- the storyboard, the URL
  // parameters and the overlay all live outside and talk only through here.
  // The box that holds only what is still showing, across every state the
  // figure will pass through. Measured off the drawing rather than computed
  // from the data, because a label's box is its rendered text and only the
  // browser knows how wide that is.
  //
  // Static, not per-frame: it is sampled at the three extremes and unioned, so
  // the frame stays put while the network moves inside it. Recomputing every
  // frame would work, but the box would then drift the whole way through a
  // morph, which reads as an unasked-for camera move.
  function fitVisible() {
    const els = [];
    svg.querySelectorAll("#lines g.line").forEach(g => els.push(g));
    for (const d of dots) els.push(d.el);
    for (const t of texts) els.push(t.el);

    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const measure = () => {
      for (const el of els) {
        if (el.style.display === "none") continue;
        let b;
        try { b = el.getBBox(); } catch (e) { continue; }
        if (!b || (!b.width && !b.height)) continue;
        x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
        x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
      }
    };

    const reset = () => { x0 = y0 = Infinity; x1 = y1 = -Infinity; };
    const taken = () => {
      if (!(x1 > x0 && y1 > y0)) return null;
      const pad = Math.max(x1 - x0, y1 - y0) * 0.03;
      return [x0 - pad, y0 - pad, (x1 - x0) + 2 * pad, (y1 - y0) + 2 * pad];
    };

    const wasView = view, wasStr = str, wasGeo = geo;
    subsetBox = subsetLinBox = null;        // measure against the drawn box
    reset();
    geometry(0, 0, 0); measure();                    // the schematic map
    if (geoData) { geometry(0, 0, 1); measure(); }   // ...and on the ground
    const netBox = taken();
    reset();
    geometry(1, 0, 0); measure();                    // unfolded into rows
    const linBox = taken();
    geometry(ease(wasView), ease(wasStr), ease(wasGeo));

    if (!netBox || !linBox) return;
    subsetBox = netBox;
    subsetLinBox = linBox;
    dirty = true;
    draw();
  }

  window.__present = {
    advance(dt) { advance(dt); draw(); },
    seek(sec) { now = Math.max(t0, Math.min(t1, sec)); dirty = true; draw(); },
    setCapture(on) {
      capture = on;
      if (on) {
        if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        last = performance.now();
        rafId = requestAnimationFrame(frame);
      }
    },
    setPlaying(on) { playing = on; },
    setSpeed(x) { speed = x; },
    // setView and setGeo are the two axes, unchanged and independent:
    // bin/_record.js raises geo and *then* names a view, so a setView that
    // lowered geo by itself would break every geographic export.
    setView(v, dur) { setMode(v, dur); },
    setGeo(on, dur) { return setGeo(on, dur); },
    // Both axes at once, by the public name of the view. This is what the
    // site's switcher drives, and what the page's own buttons go through.
    showView(name, dur) { showView(name, dur); },
    hasGeo() { return !!geoData; },
    setLabels(on) { setLabels(on); },
    setRoutes(keep) {
      for (const r of routes) setRoute(r, !keep || keep.indexOf(r) >= 0);
      // Showing everything again means the drawn box is right again.
      if (hidden.size) fitVisible();
      else { subsetBox = subsetLinBox = null; dirty = true; }
      draw();
    },
    setFrame(aspect, top, margin) {
      frameAspect = aspect || 0;
      if (typeof top === "number") frameTop = top;
      if (typeof margin === "number") frameMargin = margin;
      dirty = true; draw();
    },
    // Snap every tween to its target: a still should never catch a transition
    // halfway through.
    settle() {
      view = viewTarget; str = strTarget; geo = geoTarget;
      viewTween = strTween = geoTween = null;
      for (const entry of rowTarget) rowPos.set(entry[0], entry[1]);
      dirty = true; draw();
    },
    bounds() { return { t0: t0, t1: t1 }; },
    onDraw(fn) { onDraw = fn; },
    state() {
      return { now: now, clock: fmt(now), shown: shown, mode: mode,
               view: view, str: str, geo: geo, box: lastBox.slice(),
               viewName: viewName(), labels: labelsOn };
    },
  };
  // Presentation mode: policy, on top of the mechanism window.__present exposes.
//
// Everything here is driven by the URL, so a city can be opened clean in a
// browser to present from or to screen-record by hand, and the exporter is only
// another caller rather than a second renderer:
//
//   maps/cdmx-metro.html?present=1&view=map&labels=0&title=1&clock=1&frame=9:16
//
// `controls=1` adds the view switcher, so a presentation can be steered. It is
// off by default and the exporter never sets it: anything visible in present
// mode is captured into the frame.
//
// Nothing in here reaches into the page's internals; it talks only through
// window.__present.
(function () {
  var P = window.__present;
  if (!P) return;
  var q = new URLSearchParams(location.search);
  if (q.get("present") !== "1") return;

  var num = function (key, fallback) {
    var v = parseFloat(q.get(key));
    return isFinite(v) ? v : fallback;
  };
  var on = function (key, fallback) {
    var v = q.get(key);
    return v === null ? fallback : v === "1";
  };

  // ------------------------------------------------------------------- frame
  // "9:16" -> 0.5625. The box is padded to this aspect inside the SVG rather
  // than the SVG being letterboxed inside the page: the page background and the
  // map background are not the same colour in the dark theme, so a letterbox
  // would show a seam -- and only a padded box gives a still and a video of the
  // same preset an identical frame.
  // Slightly more of the added height goes above the network, because that is
  // where the name sits and a title wants air above it. The margin is wider
  // when there is an overlay, so the text has ground of its own.
  var titled = q.get("title") === "1" || q.get("clock") === "1";
  var top = num("frametop", 0.46);
  var margin = num("margin", titled ? 0.085 : 0.025);

  var frame = q.get("frame");
  var fixed = null;
  if (frame) {
    var parts = frame.split(":").map(Number);
    if (parts.length === 2 && parts[0] > 0 && parts[1] > 0) fixed = parts[0] / parts[1];
  }

  // With no frame given -- someone opening this in a browser to present from,
  // rather than an export asking for a specific aspect -- fill the window, and
  // keep filling it when the window changes.
  function fit() {
    P.setFrame(fixed || (innerWidth / innerHeight), top, margin);
  }
  fit();
  if (!fixed) addEventListener("resize", fit);

  // ------------------------------------------------------------------- state
  var view = q.get("view") || "map";
  // "geographic" is the map view with the geographic axis raised, not a fourth
  // renderer -- so it is a view to a caller and two calls in here. A page built
  // without geographic geometry ignores it and shows the schematic map; the
  // exporter refuses the export before it gets this far, which is where that
  // belongs.
  P.setGeo(view === "geographic", 0);
  if (view === "geographic") view = "map";
  // "schematic" is what the switcher calls it now. The key stayed `map`,
  // because it is written into every atlas link and every storyboard, so both
  // spellings have to arrive at the same view.
  if (view === "schematic") view = "map";
  if (view === "time") view = "string";        // the page's internal name
  P.setView(view);
  P.setLabels(on("labels", true));
  if (q.get("lines")) P.setRoutes(q.get("lines").split(","));
  P.setSpeed(num("speed", 60));

  var at = q.get("at");
  if (at) {
    var hm = at.split(":").map(Number);
    if (hm.length >= 2) P.seek(hm[0] * 3600 + hm[1] * 60 + (hm[2] || 0) * 1);
  }
  if (!on("play", true)) P.setPlaying(false);
  P.settle();

  // ---------------------------------------------------------------- sequence
  // `sequence=transform` runs the argument the essay is making, on a loop: the
  // network as it sits on the ground, straightening into the schematic map,
  // then unfolding into a row per line. Each step throws away more of the
  // geography and is easier to read for it, which is the point being made.
  //
  // A figure running this gets no controls of its own -- the sequence *is* the
  // content, and a switcher beside it invites the reader to interrupt the
  // sentence halfway through.
  if (q.get("sequence") === "transform" && P.hasGeo && P.hasGeo()) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      // Show the finished map and leave it alone. The trains still run: that is
      // the timetable, not decoration, and it is not what "reduce motion" means.
      P.setGeo(false, 0);
    } else {
      var MORPH = 1.8, HOLD = 2.6;
      // There and back, so the loop reads as a rewind rather than a jump cut.
      var steps = [
        function () { P.setGeo(false, MORPH); },   // ground -> schematic
        function () { P.setView("linear", MORPH); },  // schematic -> rows
        function () { P.setView("map", MORPH); },     // rows -> schematic
        function () { P.setGeo(true, MORPH); },    // schematic -> ground
      ];
      var at = 0;
      P.setGeo(true, 0);
      setTimeout(function step() {
        steps[at]();
        at = (at + 1) % steps.length;
        setTimeout(step, (MORPH + HOLD) * 1000);
      }, HOLD * 1000);
    }
  }

  // ----------------------------------------------------------------- overlay
  // The view switcher, for a presentation opened in a browser rather than one
  // being captured. Off by default, and that default is what keeps it out of
  // every export: url_for() never sets it, so a recorded frame is exactly what
  // it was before this existed. A document-level attribute rather than a style,
  // the way `present` itself is set -- the stylesheet acts on it, and nothing
  // in here reaches into the page.
  if (on("controls", false)) {
    document.documentElement.setAttribute("data-controls", "");
  }

  var box = document.getElementById("present-overlay");
  var nameEl = box.querySelector(".name");
  var timeEl = box.querySelector(".time");

  var showName = on("title", false);
  var showClock = on("clock", false);
  nameEl.hidden = !showName;
  timeEl.hidden = !showClock;

  if (showName) {
    // Two lines, because a city and its network are two facts. The page's own
    // <h1> carries whatever the pipeline was given; city/network split it.
    var city = q.get("city") || "";
    var network = q.get("network") || "";
    if (!city && !network) {
      city = (document.querySelector("h1") || {}).textContent || "";
    }
    nameEl.querySelector("b").textContent = city;
    nameEl.querySelector("span").textContent = network;
    // Which service day this is. An exported clock reading 07:14 says nothing
    // about *when*, and these feeds are snapshots -- the atlas names the date
    // beside every network, so an image that travels on its own should too.
    var when = q.get("date") || "";
    var whenEl = nameEl.querySelector(".when");
    whenEl.textContent = when;
    whenEl.hidden = !when;
  }

  if (showClock) {
    P.onDraw(function () { timeEl.textContent = P.state().clock; });
  }

  // --------------------------------------------------------------- safe area
  // Where Instagram's own controls sit over a 9:16 frame. A preview aid only --
  // the exporter writes this into a separate file and never into a deliverable.
  if (q.get("safe") === "1") {
    var zones = [
      { top: "0", left: "0", width: "100%", height: "12%" },   // status bar, top actions
      { bottom: "0", left: "0", width: "100%", height: "22%" },// caption, handle, audio
      { top: "40%", right: "0", width: "18%", height: "38%" }, // the button rail
    ];
    var layer = document.createElement("div");
    layer.id = "present-safe";
    zones.forEach(function (z) {
      var d = document.createElement("div");
      // Only the sides the zone actually names, or an unset edge resolves to 0
      // and stretches the box across the frame.
      ["top", "bottom", "left", "right", "width", "height"].forEach(function (k) {
        if (z[k] !== undefined) d.style[k] = z[k];
      });
      layer.appendChild(d);
    });
    document.body.appendChild(layer);
  }
})();

  rafId = requestAnimationFrame(frame);
})();
</script>
</html>
