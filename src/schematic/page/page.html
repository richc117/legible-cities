<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
__ICONS__
__SOCIAL__
<script>
  // Applied before paint so the page never flashes the wrong theme. Shares the
  // rc-theme key with the rest of the site.
  //
  // The URL wins over localStorage, and is read first: an export runs from a
  // file:// URL, where reading localStorage can throw outright, and a capture
  // cannot afford to spend frame 1 in the wrong palette.
  (function () {
    var q = new URLSearchParams(location.search);
    var theme = q.get("theme");
    if (!theme) {
      try { theme = localStorage.getItem("rc-theme"); } catch (e) {}
    }
    if ((theme || "warm-dark") === "sepia") {
      document.documentElement.setAttribute("data-theme", "sepia");
    }
    // Present mode is a document-level flag so the stylesheet can act on it
    // before any script runs, rather than reformatting a painted page.
    if (q.get("present") === "1") {
      document.documentElement.setAttribute("data-present", "");
    }
  })();
</script>
<style>
  :root {
    --bg: #15120f; --bg-soft: #1f1915; --text: #f2ede6; --muted: #c3b8aa;
    --border: #3a2f27; --link-hover: #ded5c8; --focus: #81a5ff;
    /* Consumed by the inlined SVG. Only page furniture -- never a line colour,
       which belongs to the agency and is drawn literally. */
    --map-bg: #1f1915; --map-station-fill: #f2ede6;
    --map-station-stroke: #15120f; --map-label: #f2ede6;
    --train-halo: #15120f;
  }
  :root[data-theme="sepia"] {
    --bg: #f7efe1; --bg-soft: #f0e2cf; --text: #2d241d; --muted: #655748;
    --border: #cab9a2; --link-hover: #1f1812; --focus: #4068cf;
    --map-bg: #f7efe1; --map-station-fill: #f7efe1;
    --map-station-stroke: #2d241d; --map-label: #2d241d;
    --train-halo: #f7efe1;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 18px; line-height: 1.72;
  }
  a { color: var(--text); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--link-hover); }
  a:focus-visible, button:focus-visible, input:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px;
  }
  /* Said to a screen reader and drawn nowhere: the one live region, below, and
     the map's description. Out of the flow, so it adds no gap to the bar it sits
     in, no height to the header and nothing to the stage. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  header {
    background: var(--bg); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5; padding: 0.7rem 1.4rem 0.6rem;
  }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.55rem 1.1rem;
  }
  .bar + .bar { margin-top: 0.5rem; }
  .spacer { flex: 1 1 auto; }
  h1 {
    font-size: 1.05rem; font-weight: 700; margin: 0;
    min-width: 0; flex: 0 1 auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .back { font-size: 0.86rem; color: var(--muted); text-decoration: none;
          white-space: nowrap; }
  .back:hover { color: var(--text); }
  .clock { font-variant-numeric: tabular-nums; font-size: 1.35rem; min-width: 5.5ch; }
  .sub { color: var(--muted); font-size: 0.86rem; }
  #count::after { content: " trains"; }
  .group { display: flex; align-items: center; gap: 0.6rem; }
  button {
    font: inherit; font-size: 0.86rem; color: var(--muted); background: none;
    border: 0; border-bottom: 1px solid transparent; padding: 0.1rem 0;
    cursor: pointer; white-space: nowrap;
  }
  button:hover { color: var(--text); }
  button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--text); }

  /* An exclusive choice should not look like the toggles beside it. Sharing a
     ground and a border makes "one of these" read at a glance, which the bare
     words did not. */
  .segmented {
    display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
    overflow: hidden; background: var(--bg-soft);
  }
  /* Icons, on every device. Four words is a slab at any width -- it was 196px
     of a 390px screen with three -- and one rendering is one thing to reason
     about rather than two. The accessible name is the button's aria-label; the
     title is the sighted pointer user's tooltip. */
  .segmented button {
    border: 0; border-radius: 0; color: var(--muted);
    width: 2rem; height: 1.7rem; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .segmented button + button { border-left: 1px solid var(--border); }
  .segmented button[aria-pressed="true"] {
    background: var(--text); color: var(--bg); border-bottom-color: transparent;
  }
  /* The group clips what falls outside it, so the ring is drawn inside the
     button, and the two end buttons take the group's curve so the clip does not
     cut it. On a pressed one the ring sits on --text, which --focus is under 3:1
     against in both themes; a band of --bg between the two puts it on a ground
     it clears. */
  .segmented button:focus-visible { outline-offset: -2px; }
  .segmented button:first-child:focus-visible { border-radius: 999px 0 0 999px; }
  .segmented button:last-child:focus-visible { border-radius: 0 999px 999px 0; }
  .segmented button[aria-pressed="true"]:focus-visible { box-shadow: inset 0 0 0 4px var(--bg); }
  /* Phosphor's icons (MIT), base64'd from page/icons/ by animate.py. This page
     has to stay one file, so they arrive as data URIs rather than as a
     request. Masked over currentColor so they take the theme and invert with
     the pressed state. */
  .segmented button::before {
    content: ""; width: 16px; height: 16px; background: currentColor;
    mask: var(--icon) center / contain no-repeat;
    -webkit-mask: var(--icon) center / contain no-repeat;
  }
  #view-geo { --icon: url("__ICON_GEO__"); }
  #view-map { --icon: url("__ICON_SCHEMATIC__"); }
  #view-linear { --icon: url("__ICON_LINEAR__"); }
  #view-string { --icon: url("__ICON_TIME__"); }

  input[type=range] {
    flex: 1 1 12rem; min-width: 8rem; max-width: 26rem; accent-color: var(--text);
  }

  /* Secondary controls: everything you touch once a session rather than once a
     minute. Open by default where there is room, folded away on a phone. */
  #more-panel { margin-top: 0.55rem; }
  #more-panel[hidden] { display: none; }
  .panel-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 1.4rem;
    padding: 0.4rem 0 0.2rem;
  }
  /* Clusters stay together when the row wraps, so "All / None" never ends up
     orphaned from the word Lines. */
  .panel-group {
    display: inline-flex; align-items: center; gap: 0.6rem;
  }
  .panel-label { color: var(--muted); font-size: 0.86rem; }
  .lines { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer;
    user-select: none; font-size: 0.86rem; color: var(--muted);
  }
  .chip:hover { color: var(--text); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  /* A line's colour is the agency's and is drawn as published. Where it is under
     3:1 against the header's ground the dot gets a 1px ring in the label
     colour, in that theme only: data-weak lists the themes it fails in, and the
     theme can change in place (setTheme), so each theme has its own rule. */
  :root:not([data-theme="sepia"]) .chip .dot[data-weak~="warm-dark"],
  :root[data-theme="sepia"] .chip .dot[data-weak~="sepia"] {
    box-shadow: 0 0 0 1px var(--text);
  }
  .chip[aria-pressed="true"] { color: var(--text); }
  .chip[aria-pressed="false"] .dot { opacity: 0.3; }
  .sort { color: var(--muted); font-size: 0.86rem; display: inline-flex;
          align-items: center; gap: 0.45rem; }
  .sort[hidden] { display: none; }
  /* The touch rule below gives every button a display of its own, which beats
     [hidden]; this one is more specific than it. */
  .sort button[hidden] { display: none; }
  /* One rule for whatever button the header hides, because the touch rule below
     gives every button a display of its own and a display beats [hidden]. The
     Labels button in the Time view is the one that needed it; the rule above is
     this one's older, narrower twin for the Sort group's. */
  header button[hidden] { display: none; }

  /* The stage scrolls, not the page. The inset edge shading is the only hint
     that there is more chart to the right, so it is worth the two lines. */
  #stage {
    padding: 1.4rem; overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  #stage.scrollable-right {
    -webkit-mask-image: linear-gradient(to right, #000 92%, rgba(0,0,0,0.35));
            mask-image: linear-gradient(to right, #000 92%, rgba(0,0,0,0.35));
  }
  /* The browser makes a scroller with nothing focusable inside a Tab stop, and
     whether the stage is one depends on the window (a pixel of overflow is
     enough), so it is a stop that comes and goes. When it is there it is named
     in the markup and rings like the header's controls. The ring is inset: the
     stage is the viewport's edge and an outer one would be cut off. It sits on
     --bg, and on --map-bg where the padding is 0 and the map reaches the edge;
     --focus clears 3:1 on both in both themes. Nothing in a capture has focus. */
  #stage:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  /* The fade above dims whatever is painted under it, and the ring's right edge
     is: at 35% it read 1.6:1 on the sepia ground and 2.0:1 on warm dark's. While the stage has the
     keyboard's focus the ring is drawn whole and the hint gives way to it. */
  #stage.scrollable-right:focus-visible { -webkit-mask-image: none; mask-image: none; }
  /* The rows' names in the Linear and Time views' gutter, in the map's label
     colour, which the script sets. Bold, so on the system stack whatever face
     the map's names are drawn in: a face the SVG embeds (engine issue 76) is
     its regular weight alone, and the browser would fake a bold from it. */
  .rowname { font-weight: 700; font-size: 13px; dominant-baseline: middle;
             font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  /* Width is set by the script, which is the only thing that knows the view:
     the map wants to fill the height and pan, while the rows want a legible
     column width and let the page scroll. A CSS rule cannot tell them apart,
     and the one that used to try pinned the width to 100% and killed the
     panning it was meant to enable. */
  svg { display: block; height: auto; }
  /* Painted behind the glyph so a train reads against its own line colour. */
  /* The fallback matters: lifted out of this page and rendered standalone --
     an <img>, or rsvg-convert -- an unresolved var() paints black rather than
     nothing, so every train would grow a black halo. */
  .train { paint-order: stroke; stroke: var(--train-halo, #15120f); stroke-width: 1.6; }
  @media (max-width: 700px) {
    html, body { font-size: 17px; }
    /* Two rows, not four. The toolbar was taking a third of the screen before
       anything of the map appeared. */
    header { padding: 0.35rem 0.7rem; }
    /* nowrap, deliberately: a wrapping flex line wraps *before* it shrinks, so
       with wrap on the title never truncates and the view switcher drops to a
       row of its own. Everything here can shrink -- the title to an ellipsis,
       the scrubber to a stub -- so one line is always reachable. */
    .bar { gap: 0.2rem 0.7rem; flex-wrap: nowrap; }
    .bar + .bar { margin-top: 0.1rem; }
    h1 { font-size: 0.95rem; }
    .clock { font-size: 1rem; min-width: 4.6ch; }
    /* The service date is on the atlas entry that got you here. */
    .sub:not(#count) { display: none; }
    #count { font-size: 0.78rem; }
    /* Out of sight, not out of the page: "12 trains", not "12", to a reader. */
    #count::after {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
    input[type=range] { min-width: 3.5rem; flex: 1 1 3.5rem; }
    .spacer { display: none; }
    .back { font-size: 0; }              /* keeps the arrow, drops the word */
    .back::before { content: "\2190"; font-size: 1rem; }
    button { font-size: 0.8rem; }
    #stage { padding: 0.7rem 0; }
  }

  /* Both platforms ask for 44px. Scoped to touch so the desktop toolbar keeps
     its density. */
  @media (pointer: coarse) {
    button, .chip, .back {
      min-height: 44px; display: inline-flex; align-items: center;
    }
    input[type=range] { height: 44px; }

    /* The switcher is already icons everywhere; on touch each one grows to the
       44px square both platforms ask for. Four of those is 176px of a 390px
       screen, in a header that has to stay under 15% of the viewport --
       bin/measure-mobile is the check on that. */
    .segmented button { min-width: 44px; width: 44px; height: 44px; }
  }

  /* Presentation mode: the visualization and nothing else, for export or for
     showing on a screen. The header is *hidden*, never removed -- draw() writes
     to the clock and the train count every frame and would throw without them.
     The backdrop is made transparent so the padded frame reads as one surface:
     in warm-dark --map-bg (#1f1915) is lighter than --bg (#15120f), which is
     the faint card edge visible around the map on the normal page. */
  :root[data-present] header { display: none; }
  /* ...except with `controls=1`, which brings back the view switcher and
     nothing else. It returns as a floating overlay rather than as flow content:
     #stage is height:100vh under an overflow:hidden root, so there is no band
     above it left to occupy. Every other child of the header stays
     display:none, which keeps #clock, #count and #scrub in the DOM for draw()
     to write to -- the same reason the header is hidden and not removed.

     Top right is the one free corner: the overlay puts the name top left and
     the clock bottom right, on this same inset, so the three line up. That
     place assumes the clock's default corner; the atlas's Presentation link
     never sets another. */
  :root[data-present][data-controls] header {
    display: block; position: fixed; top: 4.2vmin; right: 5vmin; left: auto;
    z-index: 12; background: none; border: 0; padding: 0;
  }
  :root[data-present][data-controls] header .bar > *:not(.segmented),
  :root[data-present][data-controls] header .bar + .bar,
  :root[data-present][data-controls] #more-panel { display: none; }
  :root[data-present], :root[data-present] body { height: 100%; overflow: hidden; }
  :root[data-present] { --map-bg: transparent; }
  /* The halo of a label that crosses a line is a stroke the SVG writes in
     --map-bg, and that is transparent here, which leaves a stroke that paints
     nothing where the halo is the whole point. So it takes the ground the map
     sits on instead: --bg, the literal export.resolve() writes into a
     standalone SVG. A rule outranks the presentation attribute, so the SVG's
     own text is as it was and only this page changes. (This group is hidden
     once the script has drawn the page's own labels, which is what the rules
     below are for.) */
  :root[data-present] #stage svg #labels text[stroke] { stroke: var(--bg); }
  /* The page draws its own labels over the map's and hides the map's group, so
     the halo the renderer gave a label that sits over a line, and that every
     standalone SVG paints, was dropped when the linear view took the labels
     over. The script marks the page's label `haloed` while the schematic map is
     what shows and its source text carries the renderer's halo, and this paints
     it as the renderer wrote it (render.py: 3.2 wide, round, behind the glyphs).
     Off present mode that is the card the map is drawn on, --map-bg, which is
     what the renderer meant; in present mode, where the card is transparent,
     it is the ground the map sits on. */
  #linear-labels text.haloed {
    paint-order: stroke; stroke: var(--map-bg); stroke-width: 3.2; stroke-linejoin: round;
  }
  :root[data-present] #linear-labels text.haloed { stroke: var(--bg); }
  :root[data-present] #stage {
    padding: 0; overflow: hidden; height: 100vh;
    display: grid; place-items: center;
  }
  /* The edge fade exists to hint at horizontal scroll. There is no scrolling
     here, and it would bake a gradient into the export. */
  :root[data-present] #stage.scrollable-right { -webkit-mask-image: none; mask-image: none; }
  :root[data-present] #stage svg { width: 100%; height: 100%; }

  #present-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: none; padding: 4.2vmin 5vmin;
  }
  :root[data-present] #present-overlay { display: block; }
  #present-overlay .name {
    position: absolute; left: 5vmin; top: 4.2vmin;
    font-size: 3.4vmin; line-height: 1.25; color: var(--text);
  }
  #present-overlay .name b { display: block; font-weight: 700; }
  #present-overlay .name span { display: block; color: var(--muted); font-weight: 400; }
  /* The service day the trains below are actually running. Smaller than the
     network: it is a caption on the other two lines, not a third fact of equal
     weight. */
  #present-overlay .name .when { font-size: 0.72em; margin-top: 0.35em; }
  #present-overlay .time {
    position: absolute; right: 5vmin; bottom: 4.2vmin;
    font-size: 4.6vmin; font-variant-numeric: tabular-nums; color: var(--text);
  }
  #present-overlay [hidden] { display: none; }
  /* Everything below acts only on an attribute present.js sets when the
     address asks for it, so an address without a caption, a corner or a zone
     lays the overlay out exactly as it always did. */
  /* A person's caption, at the date line's size and in the network's colour.
     No halo and no ground of its own: it sits on the frame's ground, as the
     name does. The block stops short of the far edge, or of a top-right clock
     (11.5vmin wide) by 2vmin, so 80 characters wrap to two lines at most. */
  #present-overlay[data-caption] .name .caption { font-size: 0.72em; margin-top: 0.35em; }
  #present-overlay[data-caption] .name { max-width: calc(100vw - 10vmin); }
  #present-overlay[data-corner="top-right"] .name { max-width: calc(100vw - 23.5vmin); }
  /* The clock's other three corners, on the same insets as its own. */
  #present-overlay[data-corner^="top"] .time { top: 4.2vmin; bottom: auto; }
  #present-overlay[data-corner$="left"] .time { left: 5vmin; right: auto; }
  /* A platform's own interface over the frame (export.SAFE_ZONES, as
     fractions on the address). The stage keeps the top zone as bare ground and
     the map is laid out in the part below it; the name and a top clock sit on
     their usual inset below the zone, and nothing sits nearer a side than its
     side zone. In present mode --map-bg is transparent, so the reserved band
     is the same ground as the rest of the frame. */
  :root[data-present][data-zones] #stage { padding-top: calc(var(--zone-top, 0) * 100vh); }
  :root[data-zones] #present-overlay {
    --zone-inset: max(5vmin, round(up, calc(var(--zone-side, 0) * 100vw), 1px));
  }
  :root[data-zones] #present-overlay .name {
    top: calc(var(--zone-top, 0) * 100vh + 4.2vmin); left: var(--zone-inset);
  }
  :root[data-zones] #present-overlay[data-caption] .name {
    max-width: calc(100vw - 2 * var(--zone-inset));
  }
  :root[data-zones] #present-overlay[data-corner="top-right"] .name {
    max-width: calc(100vw - 2 * var(--zone-inset) - 13.5vmin);
  }
  :root[data-zones] #present-overlay .time { right: var(--zone-inset); }
  :root[data-zones] #present-overlay[data-corner$="left"] .time {
    left: var(--zone-inset); right: auto;
  }
  :root[data-zones] #present-overlay[data-corner^="top"] .time {
    top: calc(var(--zone-top, 0) * 100vh + 4.2vmin);
  }
  /* Where the platform's own UI sits. A preview aid only -- the exporter draws
     this into a separate file and never into a deliverable. */
  #present-safe { position: fixed; inset: 0; pointer-events: none; z-index: 11; }
  #present-safe div { position: absolute; background: rgba(255,0,80,0.22);
                      outline: 1px dashed rgba(255,0,80,0.8); }

  /* The title card (engine issue 44), put up and taken down by the seam's
     setCard: a scrim of the ground over the frame and on it the city, the
     network, the service day and, a line below, the caption, as present.js
     reads them off the address. All --text: on the scrim at 0.75 it clears 7:1
     over white in warm dark and over black in sepia, where --muted would need
     the scrim at 0.87. In vmin, so every preset has the same card; the day and
     the caption are 5.6 on a 1.3 line, inside the BBC's 7 to 8% of the short
     side. It cuts in and out, with no transition, so it is whole on every frame
     of its beat at any frame rate, and reduced motion has nothing to change. */
  #present-card { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #present-card .scrim { position: absolute; inset: 0; background: var(--bg); opacity: 0.75; }
  #present-card .words {
    position: absolute; top: 4.2vmin; bottom: 4.2vmin; left: 5vmin; right: 5vmin;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; text-wrap: balance; overflow-wrap: break-word; color: var(--text);
  }
  #present-card .words > * { display: block; max-width: 100%; }
  #present-card .city { font-size: 11vmin; font-weight: 700; line-height: 1.15; }
  #present-card .network { font-size: 7vmin; line-height: 1.15; }
  #present-card .day, #present-card .caption { font-size: 5.6vmin; line-height: 1.3; }
  /* The gap is one line of the caption's own. */
  #present-card .caption { margin-top: 1.3em; }
  #present-card[hidden], #present-card [hidden] { display: none; }
  /* Below the top zone, off the side zones, and above the rail's top or the
     bottom zone, whichever reaches higher (--zone-floor, which present.js
     works out from the address). */
  :root[data-zones] #present-card .words {
    --card-inset: max(5vmin, round(up, calc(var(--zone-side, 0) * 100vw), 1px));
    top: calc(var(--zone-top, 0) * 100vh + 4.2vmin);
    bottom: calc(var(--zone-floor, 0) * 100vh + 4.2vmin);
    left: var(--card-inset); right: var(--card-inset);
  }
  /* The overlay's name and clock say what the card says, so they give way to it. */
  :root[data-card] #present-overlay { visibility: hidden; }

  /* The draw-in (engine issue 44): what the pen has not reached yet. A class and
     this rule, never the visibility attribute, which route mode's names own, nor
     style.display, which hiding a line owns; and hidden rather than drawn as a
     dash of no length, which a round cap paints as a dot. While the network
     draws in, the trains wait. */
  #stage svg .undrawn, #stage svg.drawing #trains { visibility: hidden; }

  /* Picking a trip on the page itself (engine issue 49), where nothing but the
     page runs: the script builds #trip only off present mode, so no frame an
     export captures can hold any of it. The station cursor is a button the
     keyboard moves from dot to dot; it is drawn only as the page's focus ring,
     round, over the dot it names, and a pointer goes through it to the map.
     Every size is its own, so the touch rule below does not make it 44px tall. */
  #station-pick {
    position: absolute; left: 0; top: 0; z-index: 4; display: block;
    width: 20px; height: 20px; min-height: 0; padding: 0; border: 0;
    border-radius: 50%; background: none; pointer-events: none;
  }
  #station-pick:focus-visible { border-radius: 50%; }
  #station-pick[hidden] { display: none; }
  /* The trip's steps, or what to do next, over the map's lower left corner and
     only while there is something to say. */
  #trip .panel {
    position: fixed; left: 1rem; bottom: 1rem; z-index: 6;
    max-width: min(26rem, calc(100vw - 2rem)); padding: 0.6rem 0.9rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.86rem; line-height: 1.5;
  }
  #trip .panel p, #trip .panel ol { margin: 0 0 0.45rem; }
  #trip .panel ol { padding-left: 1.3rem; }
  #trip .panel[hidden], #trip .panel [hidden] { display: none; }
  :root[data-present] #trip { display: none; }
</style>
<header>
  <div class="bar">
    <a class="back" href="__BACK__" aria-label="Back to the atlas">&larr; Atlas</a>
    <h1>__NAME__</h1>
    <span class="sub">__SUBTITLE__</span>
    <span class="spacer"></span>
    <!-- Icon-only, so the accessible name lives on aria-label and the tooltip
         on title. #view-geo is dropped at boot on a page built without the
         geographic geometry, rather than sitting there dead. -->
    <span class="segmented" role="group" aria-label="View">
      <button id="view-geo" aria-label="Geographic" title="Geographic — where the track actually runs" aria-pressed="false"></button>
      <button id="view-map" aria-label="Schematic" title="Schematic — straightened onto a 45° grid" aria-pressed="true"></button>
      <button id="view-linear" aria-label="Linear" title="Linear — one row per line" aria-pressed="false"></button>
      <button id="view-string" aria-label="Time" title="Time — the service day as a Marey chart" aria-pressed="false"></button>
    </span>
  </div>
  <div class="bar">
    <button id="play">Pause</button>
    <!-- The one live region. Written when Play or Pause is pressed and at no
         other time: the clock and the count change every frame and are never in
         it. -->
    <span id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></span>
    <div class="clock" id="clock">--:--</div>
    <input type="range" id="scrub" min="0" max="1" step="1" value="0"
           aria-label="Time of day">
    <span class="sub" id="count">0 trains</span>
    <button id="speed" aria-label="Playback speed 60&times;">60&times;</button>
    <button id="more" aria-expanded="false" aria-controls="more-panel">More <span aria-hidden="true">&#9662;</span></button>
  </div>
  <div id="more-panel" hidden>
    <div class="panel-row">
      <span class="panel-group" role="group" aria-label="Lines">
        <span class="panel-label">Lines <span id="line-count"></span></span>
        <button id="lines-all">All</button>
        <button id="lines-none">None</button>
      </span>
      <span class="lines" id="line-toggles" role="group" aria-label="Lines shown"></span>
      <span class="panel-group">
        <button id="labels-toggle" aria-pressed="true">Labels</button>
        <span class="sort" id="sort-group" role="group" aria-label="Sort" hidden>
          <span class="panel-label">Sort</span>
          <button id="sort-arranged" aria-pressed="false" hidden>As arranged</button>
          <button id="sort-line" aria-pressed="true">A&ndash;Z</button>
          <button id="sort-size" aria-pressed="false">Stations</button>
        </span>
      </span>
    </div>
  </div>
</header>
<main id="stage" aria-label="Map">__SVG__</main>
<div id="present-overlay" aria-hidden="true">
  <div class="name" hidden><b></b><span></span><span class="when" hidden></span><span class="caption" hidden></span></div>
  <div class="time" hidden></div>
</div>
<div id="present-card" hidden aria-hidden="true">
  <div class="scrim"></div>
  <div class="words"><b class="city" hidden></b><span class="network" hidden></span><span class="day" hidden></span><span class="caption" hidden></span></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script id="routing" type="application/json">__ROUTING__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  // What the page writes for a line: its name where the map gave it one,
  // else its label. The label stays the key everywhere it is matched on.
  const display = r =>
    (data.names && Object.prototype.hasOwnProperty.call(data.names, r) && data.names[r]) || r;
  // Declared here rather than beside the view state below: the track and dot
  // builders read it, and they run first.
  const geoData = data.geo || null;
  const svg = document.querySelector("#stage svg");
  const NS = "http://www.w3.org/2000/svg";
  const params = new URLSearchParams(location.search);
  const present = params.get("present") === "1";
  let capture = false;    // true while an exporter is stepping the clock itself
  let shown = 0;          // trains actually drawn last frame; capture asserts on it
  let onDraw = null;      // present mode's overlay, called at the end of draw()
  let rafId = null;       // so a capture can cancel a frame that is already queued
  // The draw-in's two facts, here because advance(), setMode() and setCapture()
  // read them; the rest of it is further down. 1 is the whole network.
  let drawAsked = 1;      // the fraction setDrawn was last given
  let drawing = false;    // true while the network shows less than all of itself
  // Snapping the tweens is right for someone who asked not to be moved, and
  // wrong for a capture, where it would turn every transition into a hard cut.
  const reduced = !present && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------------------------------------------------------- geometry
  const vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  const [vbX, vbY, vbW, vbH] = vb;
  // The generated SVG carries width/height attributes, which fix its intrinsic
  // aspect ratio -- so  would ignore a viewBox that grows for the
  // linear view. CSS sizes the element here, so drop them.
  svg.removeAttribute("width");
  svg.removeAttribute("height");

  // Where each station sits on the map, read back off the drawing rather than
  // shipped a second time in the payload.
  const mapXY = new Map();
  svg.querySelectorAll("#stations circle[data-node]").forEach(c => {
    mapXY.set(c.getAttribute("data-node"), {
      x: +c.getAttribute("cx"), y: +c.getAttribute("cy"), r: +c.getAttribute("r"),
      // The marker's own outline, kept as the SVG wrote it: a style may set it
      // to nothing, and a number read back would make that falsy.
      w: c.getAttribute("stroke-width"),
    });
  });

  // The linear layout: one row per line, plus a shallower row per branch.
  const layout = data.linear || { columns: 1, lines: [] };
  // Station names sit above their dot at an angle, so a row needs clear space
  // above it and past its right-hand end or the outermost names get cut off.
  const LABEL_RISE = 112;
  // A row needs this much height for its names to be readable. A network with
  // many lines therefore needs a taller canvas than the map does -- so the
  // linear view grows the viewBox and the page scrolls, the way a list should,
  // rather than crushing 27 rows into the map's frame.
  const ROW_H = 150;
  const nLines = Math.max(layout.lines.length, 1);
  const linH = Math.max(vbH, LABEL_RISE + nLines * ROW_H);
  // The gutter has to hold the widest terminus name the time chart will print
  // there, or the left-hand end of it is sliced off by the viewBox.
  const terminusWidth = (() => {
    let longest = 0;
    for (const line of layout.lines) {
      const spine = (line.rows[0] || {}).nodes || [];
      for (const pair of [spine[0], spine[spine.length - 1]]) {
        const nm = pair && (layout.names || {})[pair[0]];
        if (nm) longest = Math.max(longest, nm.length);
      }
    }
    return longest * 7.0 + 24;      // 11px Palatino runs wide on capitals
  })();
  const GUTTER = Math.max(vbW * 0.075, 74, terminusWidth);
  const RIGHT = Math.max(vbW * 0.02, 96);
  const colW = (vbW - GUTTER - RIGHT) / Math.max(layout.columns - 1, 1);
  const band = (linH - LABEL_RISE) / nLines;
  const branchDrop = Math.min(band * 0.30, 26);

  // Column of every (line, station), and which row of the line it is on.
  const cell = new Map();                       // "label node" -> {col, depth}
  const lineStations = new Map();               // label -> [{node, col, depth}]
  for (const line of layout.lines) {
    const list = [];
    for (const row of line.rows) {
      for (const pair of row.nodes) {
        cell.set(line.label + " " + pair[0], { col: pair[1], depth: row.depth });
        list.push({ node: pair[0], col: pair[1], depth: row.depth });
      }
    }
    lineStations.set(line.label, list);
  }

  // Row order is animated, so a re-sort slides rather than jumps.
  const order = layout.lines.map(l => l.label);
  const rowPos = new Map(order.map((l, i) => [l, i]));
  const rowTarget = new Map(rowPos);

  // ------------------------------------------------------------ the map in words
  // What a screen reader is told of the drawing (engine issue 61): an image whose
  // name is the network's and its count of lines, and whose description is one
  // paragraph composed here from the layout the rows are drawn from:
  //
  //   "A from Stop 4 to Stop 0, 5 stations."  A sentence a line, in the order its
  //     rows open in. The ends are the first and last named stations of its
  //     spine; "branching" is said when a row forks off that spine, and "in 2
  //     pieces" when a row is a part of the line that meets the rest nowhere. A
  //     loop line reads as its spine with a branch: the layout carries no
  //     adjacency to tell a ring from a fork, and the page's data may not grow to
  //     carry one.
  //   "The lines meet at Stop 2 and Stop 5."  The stations on two lines or more,
  //     those on the most lines first, up to eight and then a count.
  //   "Trains move along the lines as the clock runs, and the controls above the
  //     map change the view."  In present mode, which hides the header, it ends
  //     at "runs".
  //
  // Everything drawn inside the SVG is hidden from the tree: the station and row
  // names, and the trains, which come and go every frame. An image's children are
  // presentational, but Chromium keeps them in its own tree and leaves pruning
  // them to each platform, so each layer is hidden outright, and a train is born
  // inside #trains, hidden. Called once, at the end of boot, when every layer is
  // in the SVG.
  //
  // It describes the network, which nothing on the page changes: hiding a line
  // (a chip, setRoutes), changing the view or turning the labels off changes what
  // is drawn, so nothing rewrites the paragraph, and it says nothing of what is
  // hidden. It goes after the SVG inside #stage and is sr-only, out of the flow,
  // so the stage lays the SVG out exactly as before and no frame moves.
  function describeMap() {
    const stationName = layout.names || {};
    // A node the map draws no dot for is a junction LOOM inserted, not a station.
    const named = n => mapXY.has(n) && stationName[n];
    const count = (n, word) => n + " " + word + (n === 1 ? "" : "s");
    // As arranged where the map was built with an order, else the page's A-Z.
    const reading = layout.arranged ? layout.lines.slice() : layout.lines.slice().sort((a, b) =>
      display(a.label).localeCompare(display(b.label), undefined, { numeric: true }));
    const linesAt = new Map();       // station node -> the lines whose rows hold it
    const sentences = reading.map(line => {
      const stations = new Set();
      for (const row of line.rows) {
        for (const pair of row.nodes) {
          if (!mapXY.has(pair[0])) continue;
          stations.add(pair[0]);
          if (!linesAt.has(pair[0])) linesAt.set(pair[0], new Set());
          linesAt.get(pair[0]).add(line.label);
        }
      }
      const ends = ((line.rows[0] || {}).nodes || []).map(p => p[0]).filter(named)
        .map(n => stationName[n]);
      const from = ends[0], to = ends[ends.length - 1];
      const where = from && from !== to ? " from " + from + " to " + to : from ? " at " + from : "";
      // A branch starts a column past its junction; a row at column 0 is a piece
      // of the line on its own (NYC's three shuttles), which is no branch.
      const off = line.rows.filter(r => r.depth > 0 && r.nodes.length);
      const branching = off.some(r => r.nodes[0][1] > 0);
      const pieces = 1 + off.filter(r => r.nodes[0][1] === 0).length;
      return display(line.label) + where + (branching ? ", branching" : "")
        + (pieces > 1 ? ", in " + pieces + " pieces" : "") + ", "
        + count(stations.size, "station") + ".";
    });
    if (reading.length > 1) {
      // Sorted stably, so stations on as many lines keep the order they are read in.
      const meet = [...linesAt].filter(e => e[1].size > 1 && named(e[0]))
        .sort((a, b) => b[1].size - a[1].size).map(e => stationName[e[0]])
        .filter((name, i, all) => all.indexOf(name) === i);
      const SHOWN = 8;
      const listed = meet.slice(0, SHOWN);
      if (meet.length > SHOWN) listed.push((meet.length - SHOWN) + " more");
      sentences.push(!listed.length ? "No two lines share a station."
        : "The lines meet at " + (listed.length > 1
          ? listed.slice(0, -1).join(", ") + " and " + listed[listed.length - 1] : listed[0]) + ".");
    }
    sentences.push("Trains move along the lines as the clock runs"
      + (present ? "." : ", and the controls above the map change the view."));

    const paragraph = document.createElement("p");
    paragraph.id = "map-description";
    paragraph.className = "sr-only";
    paragraph.textContent = sentences.join(" ");
    svg.after(paragraph);
    // "Map of", not "Schematic map of": the same image is the geographic view,
    // the rows and the time chart, and the name stays put while it changes.
    const network = document.querySelector("h1").textContent.trim();
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label",
      (network ? "Map of " + network : "Map") + ", " + count(layout.lines.length, "line"));
    svg.setAttribute("aria-describedby", "map-description");
    for (const layer of svg.children) layer.setAttribute("aria-hidden", "true");
  }

  const linXY = (label, node) => {
    const c = cell.get(label + " " + node);
    if (!c) return null;
    const base = rowPos.get(label) || 0;
    return {
      x: vbX + GUTTER + c.col * colW,
      y: vbY + LABEL_RISE + band * (base + 0.15) + c.depth * branchDrop,
    };
  };

  // A station column narrower than this cannot be read, so on a narrow screen
  // the rows keep their width and the stage scrolls instead of shrinking.
  const MIN_COL_PX = 22;
  const stage = document.querySelector("#stage");

  function sizeStage() {
    if (present) {
      // The box has already been padded to the frame's aspect, so the SVG's own
      // "meet" fit is exact and there is nothing left to compute. Clearing the
      // inline sizes lets the stylesheet's 100%/100% win.
      svg.style.width = "";
      svg.style.height = "";
      stage.classList.remove("scrollable-right");
      return;
    }
    const cs = getComputedStyle(stage);
    const avail = stage.clientWidth
      - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const box = svg.getAttribute("viewBox").split(/\s+/).map(Number);
    const narrow = window.innerWidth <= 900;
    let w = avail;
    if (narrow && mode === "map") {
      // A wide network shrunk to a phone is unreadable: fill the height and
      // let it pan.
      w = Math.max(avail, window.innerHeight * 0.62 * (box[2] / box[3]));
    } else if (narrow) {
      // Rows keep a legible column width; the page takes the vertical scroll.
      w = Math.max(avail, layout.columns * MIN_COL_PX);
    }
    svg.style.width = w.toFixed(0) + "px";
    svg.style.height = "auto";
    stage.classList.toggle("scrollable-right",
                           stage.scrollWidth > stage.clientWidth + 1);
  }

  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ------------------------------------------------------- stringline layout
  // A Marey chart: time across, stops down, every trip a diagonal. It reuses
  // the linear layout's columns as its vertical axis, so a station is at the
  // same position in the sequence in both views -- the row simply stands up.
  const lineWidth = new Map(layout.lines.map(l => [l.label, Math.max(l.stations, 2)]));
  const lineSpan = new Map(layout.lines.map(l => {
    let max = 1;
    for (const row of l.rows) for (const pair of row.nodes) max = Math.max(max, pair[1]);
    return [l.label, max];
  }));

  const bandTop = label => vbY + LABEL_RISE + band * (rowPos.get(label) || 0) + 4;
  const bandInner = () => band * 0.80;

  // Vertical position of a station within its line's band, band-local.
  const stopY = (label, node) => {
    const c = cell.get(label + " " + node);
    if (!c) return null;
    return (c.col / (lineSpan.get(label) || 1)) * bandInner();
  };

  // ------------------------------------------------------------ linear layer
  // An interchange is one dot on the map but appears once per line in the
  // linear view, so stations and labels are rebuilt per (line, station). At
  // m = 0 every instance sits exactly where the map drew it, which makes the
  // swap invisible.
  const backdrop = svg.querySelector("#backdrop");

  // Every write to the viewBox goes through setBox. There were two writers
  // before -- the morph in geometry() and the labels toggle -- and they fought:
  // with labels off, the next dirty frame silently restored the full box.
  // Present mode adds a third concern, padding the box out to an export's
  // aspect ratio, which is only tractable with a single owner.
  const fullBox = svg.getAttribute("viewBox");
  const tightBox = svg.getAttribute("data-viewbox-nolabels");
  let labelsOn = true;
  let frameAspect = 0;    // present mode target w/h; 0 leaves the box alone
  let frameTop = 0.5;     // share of added height taken above the network
  let frameMargin = 0;    // breathing room once the aspect is reached
  let lastBox = vb.slice();
  // Set when only some lines are showing. The drawn box is sized for the whole
  // network, so one line inside it is a thin band across a mostly empty frame
  // -- and every label shrinks with it. Two boxes, not one: the network states
  // and the row state occupy different parts of the canvas, so a single box
  // spanning both leaves each of them floating in the other's space. Lerped by
  // m, exactly as the height already was. See fitVisible().
  let subsetBox = null, subsetLinBox = null;
  // Whether those boxes were measured while a face the map embeds was still
  // loading (engine issue 76): a data URI the browser decodes after the page's
  // first pass, so the names were then measured in the fallback face, and
  // settle() measures them again once it is in.
  let fittedEarly = false;
  const fontsPending = () => !!document.fonts &&
    Array.from(document.fonts).some(f => f.status === "loading" || f.status === "unloaded");

  function setBox(m) {
    // Tightening onto the network only makes sense for the map: elsewhere the
    // height belongs to the morph and the label overhang is not what sets it.
    const tight = !labelsOn && tightBox && mode === "map";
    // The chart is laid out across the full canvas width, so it keeps the drawn
    // box whatever else is hidden.
    const subset = subsetBox && mode !== "string";
    const base = subset
      ? [0, 1, 2, 3].map(i => lerp(subsetBox[i], subsetLinBox[i], m))
      : (tight ? tightBox : fullBox).split(/\s+/).map(Number);
    let x = base[0], y = base[1], w = base[2], h = base[3];
    // The row-based views are taller than the map; the morph lerps the height.
    // A subset box has already been measured in each state, so it must not be
    // stretched again on top of that.
    if (!subset && linH !== vbH) h = lerp(h, linH, m);

    if (frameAspect > 0) {
      // Grow -- never crop -- to reach the frame's aspect. Cropping a transit
      // map cuts off real stations. The split is deliberately not centred: on
      // a tall frame the added height is the gutter the title and clock live
      // in, and centring would waste it and force them over the network.
      if (w / h < frameAspect) {
        const grow = h * frameAspect - w;
        x -= grow / 2; w += grow;
      } else {
        const grow = w / frameAspect - h;
        y -= grow * frameTop; h += grow;
      }
      // Then hold the whole thing off the edges. Inflating both axes by the
      // same fraction keeps the aspect exactly. This is what stops the title
      // landing on the artwork: a view that fills its frame -- the linear one
      // does, on a tall crop -- otherwise runs a line straight through the
      // city's name.
      if (frameMargin > 0) {
        const mx = w * frameMargin, my = h * frameMargin;
        x -= mx; w += 2 * mx;
        y -= my; h += 2 * my;
      }
    }

    svg.setAttribute("viewBox",
      x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2));
    if (backdrop) {
      // Off the export path, only the height moves -- the normal page has always
      // kept the backdrop at the full box's x/y/width, and matching that keeps
      // this refactor invisible there.
      if (frameAspect > 0) {
        backdrop.setAttribute("x", x.toFixed(2));
        backdrop.setAttribute("y", y.toFixed(2));
        backdrop.setAttribute("width", w.toFixed(2));
      }
      backdrop.setAttribute("height", h.toFixed(2));
    }
    lastBox = [x, y, w, h];
    return lastBox;
  }

  const mapStations = svg.querySelector("#stations");
  const mapLabels = svg.querySelector("#labels");
  const labelSpec = new Map();
  if (mapLabels) {
    mapLabels.querySelectorAll("text[data-node]").forEach(t => {
      labelSpec.set(t.getAttribute("data-node"), {
        text: t.textContent,
        x: +t.getAttribute("x"), y: +t.getAttribute("y"),
        anchor: t.getAttribute("text-anchor") || "start",
        rotate: (t.getAttribute("transform") || "").match(/rotate\(([-\d.]+)/),
        // The renderer's own word for a label that sits over a line, read from
        // the element it wrote and kept off the page's data.
        halo: t.getAttribute("paint-order") === "stroke",
      });
    });
  }

  const dotLayer = document.createElementNS(NS, "g");
  const nameLayer = document.createElementNS(NS, "g");
  const textLayer = document.createElementNS(NS, "g");
  dotLayer.setAttribute("id", "linear-stations");
  textLayer.setAttribute("id", "linear-labels");
  nameLayer.setAttribute("id", "linear-names");
  if (mapLabels) {
    textLayer.setAttribute("font-size", mapLabels.getAttribute("font-size") || "11");
    textLayer.setAttribute("fill", mapLabels.getAttribute("fill") || "currentColor");
  }

  const dots = [];      // {el, label, node, mapPt, r}
  const texts = [];     // {el, label, node, spec, primary}
  const names = [];     // {el, label, swatch}
  const seenLabel = new Set();
  // Each line's stroke on the map, which is how tall its swatch is drawn.
  const strokeOf = new Map();
  svg.querySelectorAll("#lines g.line").forEach(g => {
    strokeOf.set(g.getAttribute("data-line"), +g.getAttribute("stroke-width") || 7);
  });

  for (const line of layout.lines) {
    for (const st of lineStations.get(line.label) || []) {
      const pt = mapXY.get(st.node);
      if (!pt) continue;

      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("r", pt.r);
      dot.setAttribute("fill", "var(--map-station-fill, #fff)");
      dot.setAttribute("stroke", "var(--map-station-stroke, #111)");
      if (pt.w !== null) dot.setAttribute("stroke-width", pt.w);
      dotLayer.appendChild(dot);
      const gn = geoData && geoData.nodes[st.node];
      dots.push({ el: dot, label: line.label, node: st.node, mapPt: pt, r: pt.r,
                  geoPt: gn ? { x: gn[0], y: gn[1] } : null });

      const name = (layout.names || {})[st.node];
      if (name) {
        const t = document.createElementNS(NS, "text");
        t.textContent = name;
        textLayer.appendChild(t);
        // The map may have had nowhere to put this name. Then there is no
        // m = 0 pose to hold, so park it on the dot and keep it invisible
        // until the rows take over.
        const spec = labelSpec.get(st.node) ||
          { x: pt.x, y: pt.y, anchor: "start", rotate: null, ghost: true };
        // Only one instance per station is opaque on the map, or interchange
        // names would overprint themselves.
        const primary = !spec.ghost && !seenLabel.has(st.node);
        seenLabel.add(st.node);
        texts.push({ el: t, label: line.label, node: st.node, spec: spec, primary: primary });
      }
    }
    const name = document.createElementNS(NS, "text");
    name.setAttribute("class", "rowname");
    name.setAttribute("text-anchor", "end");
    // In the label colour, never the line's: no colour reads at 4.5:1 on both
    // themes' grounds, so a name in its line's colour failed in one theme or
    // the other on every feed (issue 58).
    name.setAttribute("fill", "var(--map-label, #111)");
    name.textContent = display(line.label);
    nameLayer.appendChild(name);
    // The line's colour beside its name in the Time view, where the band's own
    // strokes are faint and need not start near the name: a short bar as tall
    // as the line's stroke, in the gap between the name and the band. In the
    // Linear view the row itself starts there, so the bar comes in only with
    // the chart. Decoration, not text: it is not measured for contrast.
    const swatch = document.createElementNS(NS, "rect");
    swatch.setAttribute("class", "rowswatch");
    swatch.setAttribute("fill", data.lines[line.label] || "#888");
    swatch.setAttribute("width", "8");
    swatch.setAttribute("height", strokeOf.get(line.label) || 7);
    swatch.setAttribute("opacity", "0");
    nameLayer.appendChild(swatch);
    names.push({ el: name, label: line.label, swatch: swatch });
  }

  if (mapStations) mapStations.style.display = "none";
  if (mapLabels) mapLabels.style.display = "none";
  const trainsGroup = svg.querySelector("#trains");
  svg.insertBefore(nameLayer, trainsGroup);
  svg.insertBefore(dotLayer, trainsGroup);
  svg.insertBefore(textLayer, trainsGroup);

  // ------------------------------------------------------------- stringline
  // Each route's trips are concatenated into one path in band-local space, so
  // re-sorting only moves a group transform rather than rebuilding 8,000
  // subpaths. Drawn faintly: where the diagonals crowd, that is frequency.
  //
  // The chart's own text is fainter than the rows' names: the termini beside
  // each band and the hours above it are --map-label at these opacities. Each
  // is the smallest hundredth at which that clears 4.5:1 on both grounds of
  // both themes, the --bg an export shows and the card's --map-bg, and the
  // termini are never stronger than the hours (issue 59; a test reads these
  // two lines and works the ratios out from the stylesheet).
  const CHART_NAME_OPACITY = 0.65;
  const CHART_AXIS_OPACITY = 0.65;
  const stringLayer = document.createElementNS(NS, "g");
  stringLayer.setAttribute("id", "stringline");
  stringLayer.setAttribute("opacity", "0");
  const stringGroups = new Map();
  const axisLayer = document.createElementNS(NS, "g");
  axisLayer.setAttribute("id", "stringline-axis");

  // ------------------------------------------------------------ track morph
  const tracks = [];
  svg.querySelectorAll("#lines path[data-src]").forEach(el => {
    const label = el.parentNode.getAttribute("data-line");
    const pts = el.getAttribute("d").trim().split(/[ML]\s*/).filter(Boolean)
      .map(p => {
        const xy = p.trim().split(/\s+/).map(Number);
        return { x: xy[0], y: xy[1] };
      });
    // Resampled server-side to this track's own vertex count, so vertex i has
    // a partner. A track with no twin holds its drawn shape and simply stays
    // put while the rest of the network moves.
    const g = geoData && geoData.tracks[el.getAttribute("id")];
    tracks.push({
      el: el, label: label, pts: pts, d0: el.getAttribute("d"),
      gpts: g && g.length === pts.length ? g.map(c => ({ x: c[0], y: c[1] })) : null,
      src: el.getAttribute("data-src"), dst: el.getAttribute("data-dst"),
    });
  });

  const trackD = (t, m, g) => {
    const a = linXY(t.label, t.src), b = linXY(t.label, t.dst);
    const n = t.pts.length - 1;
    if ((!a || !b) && !(g > 0 && t.gpts)) return t.d0;
    let out = "";
    for (let i = 0; i <= n; i++) {
      // Geographic first: it is a variant of the map, and the row layout is
      // then reached from wherever the network currently is.
      let px = t.pts[i].x, py = t.pts[i].y;
      if (g > 0 && t.gpts) {
        px = lerp(px, t.gpts[i].x, g);
        py = lerp(py, t.gpts[i].y, g);
      }
      if (m > 0 && a && b) {
        const f = n === 0 ? 0 : i / n;
        px = lerp(px, lerp(a.x, b.x, f), m);
        py = lerp(py, lerp(a.y, b.y, f), m);
      }
      out += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
    }
    return out;
  };

  // ------------------------------------------------------------------ trains
  const defs = document.createElementNS(NS, "defs");
  const pathEls = data.paths.map(p => {
    const el = document.createElementNS(NS, "path");
    el.setAttribute("d", p.d);
    defs.appendChild(el);
    return el;
  });
  // The geographic twin of each route, for getPointAtLength during the morph.
  // Null where the city was built without geographic geometry, which is most.
  const geoPathEls = data.paths.map(p => {
    if (!p.gd) return null;
    const el = document.createElementNS(NS, "path");
    el.setAttribute("d", p.gd);
    defs.appendChild(el);
    return el;
  });
  svg.appendChild(defs);
  const layer = trainsGroup;

  // How a train is drawn (engine issue 75). The data carries each number only
  // when it is not the default, so a page built without them reads 5 and none.
  // The dot is DOT_R, with the halo the stylesheet gives every train: the dot is
  // its line's colour, and the halo is all that parts the two.
  //
  // The trail is TRAIL seconds of playback long, as four copies of the dot at
  // the places the train was a quarter, a half, three quarters and the whole of
  // that ago: k * TRAIL * speed / 4 seconds before now on the clock this page
  // keeps, read from the same keyframes as the dot and placed by the same
  // function, so the stepped clock of an exporter places them exactly. They
  // are plain circles in the line's colour, faded from 0.6 to 0.15, with no
  // halo and no filter, and a pointer goes through them. They are drawn under
  // every dot, in a group #trains opens with. A train standing at a station has
  // none, because they would sit on it; the Time view has none, because its
  // diagonals are the trail; and a person who asked for reduced motion has none
  // in any mode, present mode (the desktop app's) included, since a trail is a
  // moving decoration. A capture draws what it was asked for, as the draw-in
  // does (`quietFade && !capture`), so an export is the same from any machine.
  const DOT_R = Number.isFinite(data.dot_radius) ? data.dot_radius : 5;
  const TRAIL = Number.isFinite(data.trail) && data.trail > 0 ? data.trail : 0;
  const TRAIL_OPACITY = [0.6, 0.45, 0.3, 0.15];
  const copies = new Map();     // trip index -> its four copies, nearest the dot first
  let trailLayer = null;
  if (TRAIL > 0) {
    trailLayer = document.createElementNS(NS, "g");
    trailLayer.setAttribute("id", "trail");
    trailLayer.setAttribute("pointer-events", "none");
    layer.insertBefore(trailLayer, layer.firstChild);
  }

  const trips = data.trips;
  const starts = trips.map(t => t.k[0][0]);
  const ends = trips.map(t => t.k[t.k.length - 1][0]);
  const maxSpan = Math.max.apply(null, trips.map((t, i) => ends[i] - starts[i]));
  const t0 = Math.min.apply(null, starts), t1 = Math.max.apply(null, ends);

  const routes = [...new Set(trips.map(t => t.r))].sort();
  const hidden = new Set();
  const nodes = new Map();
  // Route mode's fade (engine issue 49; the trip itself is further down): the
  // opacity each line is drawn at now, by label, for a line on its way to or
  // from TRIP_FADE or held there. Empty while no trip is shown, and then
  // nothing writes an opacity it did not write before the trip existed.
  // Declared here because draw() and geometry() read it from the first frame.
  const fadeAt = new Map();
  const fadeOf = label => (fadeAt.has(label) ? fadeAt.get(label) : 1);
  let fadeDirty = false;
  let tripRidden = null;     // the labels the trip on show rides, or null
  let tripPassed = null;     // the stations it passes, or null
  let pickCursor = null;     // the station cursor, off present mode only

  // Under reduced motion the trains start paused, and a reader can still press
  // Play. `reduced` is false in present mode, so a capture starts as it always did.
  let now = 7 * 3600, speed = 60, playing = !reduced, last = performance.now();
  // Two tweens rather than one three-way switch: m unfolds the map into rows,
  // s stands those rows up into a time chart. A jump from map to stringline
  // simply runs both at once.
  let view = 0, viewTarget = 0;     // m: 0 = map, 1 = linear rows
  let str = 0, strTarget = 0;       // s: 0 = network, 1 = stringline
  // g: 0 = the schematic map as drawn, 1 = the same network before octi
  // straightened it. A third axis on the same interpolation, not a third
  // renderer -- and it is only ever non-zero on a page built with geo data.
  let geo = 0, geoTarget = 0;
  let mode = "map";                 // map | linear | string
  let dirty = true;

  const clock = document.getElementById("clock");
  const count = document.getElementById("count");
  const scrub = document.getElementById("scrub");
  scrub.min = t0; scrub.max = t1; scrub.value = now;

  const timeX = t =>
    vbX + GUTTER + ((t - t0) / Math.max(t1 - t0, 1)) * (vbW - GUTTER - RIGHT);

  (function buildStringline() {
    const byRoute = new Map();
    for (const trip of trips) {
      const path = data.paths[trip.p];
      let d = "";
      for (let i = 0; i < trip.k.length; i++) {
        const f = trip.k[i][1];
        const lo = Math.min(Math.floor(f), path.nodes.length - 1);
        const hi = Math.min(lo + 1, path.nodes.length - 1);
        const ya = stopY(trip.r, path.nodes[lo]), yb = stopY(trip.r, path.nodes[hi]);
        if (ya === null || yb === null) continue;
        const y = lerp(ya, yb, f - lo);
        d += (d ? "L" : "M") + timeX(trip.k[i][0]).toFixed(1) + " " + y.toFixed(1);
      }
      if (d.indexOf("L") < 0) continue;   // a single point draws nothing
      if (!byRoute.has(trip.r)) byRoute.set(trip.r, []);
      byRoute.get(trip.r).push(d);
    }
    for (const line of layout.lines) {
      const g = document.createElementNS(NS, "g");
      const el = document.createElementNS(NS, "path");
      el.setAttribute("d", (byRoute.get(line.label) || []).join(""));
      el.setAttribute("fill", "none");
      el.setAttribute("stroke", data.lines[line.label] || "#888");
      el.setAttribute("stroke-width", "1.4");
      el.setAttribute("stroke-linecap", "round");
      // Busy lines would otherwise fill in solid; thinning them lets density
      // read as density rather than as a block of colour.
      const busy = (byRoute.get(line.label) || []).length;
      el.setAttribute("opacity", (busy > 400 ? 0.16 : busy > 180 ? 0.28
                                 : busy > 90 ? 0.4 : 0.55).toFixed(2));
      g.appendChild(el);

      // Without the two termini the vertical axis has no reference: you can see
      // that a train is climbing but not what it is climbing towards.
      const spine = line.rows[0] ? line.rows[0].nodes : [];
      if (spine.length > 1) {
        const ends = [spine[0], spine[spine.length - 1]];
        ends.forEach((pair, i) => {
          const nm = (layout.names || {})[pair[0]];
          if (!nm) return;
          const t = document.createElementNS(NS, "text");
          t.setAttribute("x", (vbX + GUTTER - 14).toFixed(1));
          t.setAttribute("y", (i === 0 ? 4 : bandInner() + 4).toFixed(1));
          t.setAttribute("text-anchor", "end");
          t.setAttribute("font-size", "11");
          t.setAttribute("fill", "var(--map-label, #111)");
          t.setAttribute("opacity", CHART_NAME_OPACITY);
          t.textContent = nm;
          g.appendChild(t);
        });
      }

      stringLayer.appendChild(g);
      stringGroups.set(line.label, g);
    }
    // Hour gridlines, so the time axis can actually be read.
    const step = (t1 - t0) > 12 * 3600 ? 3 * 3600 : 3600;
    for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
      const x = timeX(t);
      const tick = document.createElementNS(NS, "line");
      tick.setAttribute("x1", x.toFixed(1)); tick.setAttribute("x2", x.toFixed(1));
      tick.setAttribute("y1", (vbY + LABEL_RISE - 26).toFixed(1));
      tick.setAttribute("y2", (vbY + LABEL_RISE + band * nLines).toFixed(1));
      tick.setAttribute("stroke", "var(--map-label, #111)");
      tick.setAttribute("stroke-width", "0.6");
      tick.setAttribute("opacity", "0.16");
      axisLayer.appendChild(tick);
      const lab = document.createElementNS(NS, "text");
      lab.setAttribute("x", x.toFixed(1));
      lab.setAttribute("y", (vbY + LABEL_RISE - 32).toFixed(1));
      lab.setAttribute("text-anchor", "middle");
      lab.setAttribute("font-size", "13");
      lab.setAttribute("fill", "var(--map-label, #111)");
      lab.setAttribute("opacity", CHART_AXIS_OPACITY);
      lab.textContent = String(Math.floor(t / 3600) % 24).padStart(2, "0") + ":00";
      axisLayer.appendChild(lab);
    }
    stringLayer.appendChild(axisLayer);
    // The playhead ties the chart to the clock: it is the same instant the
    // network views are showing.
    const head = document.createElementNS(NS, "line");
    head.setAttribute("id", "playhead");
    head.setAttribute("stroke", "var(--map-label, #111)");
    head.setAttribute("stroke-width", "1.2");
    head.setAttribute("opacity", "0.75");
    stringLayer.appendChild(head);
    svg.insertBefore(stringLayer, trainsGroup);
  })();
  const playhead = svg.querySelector("#playhead");

  const fmt = s => {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return String(h % 24).padStart(2, "0") + ":" + String(m).padStart(2, "0")
         + (h >= 24 ? " +1d" : "");
  };

  // Fractional stop index at time t. Both views read this same number, which
  // is what keeps them in step.
  const stopAt = (keys, t) => {
    let lo = 0, hi = keys.length - 1;
    if (t <= keys[0][0]) return keys[0][1];
    if (t >= keys[hi][0]) return keys[hi][1];
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (keys[mid][0] <= t) lo = mid; else hi = mid;
    }
    const ka = keys[lo], kb = keys[hi];
    return kb[0] === ka[0] ? kb[1] : ka[1] + (kb[1] - ka[1]) * (t - ka[0]) / (kb[0] - ka[0]);
  };

  const lowerBound = t => {
    let lo = 0, hi = starts.length;
    const cutoff = t - maxSpan;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (starts[mid] < cutoff) lo = mid + 1; else hi = mid;
    }
    return lo;
  };

  function geometry(m, sf, g) {
    // Network layers dim as the chart takes over; both are positioned every
    // frame so a re-sort moves them together.
    const networkOpacity = (1 - sf).toFixed(3);
    for (const g of [dotLayer, textLayer, svg.querySelector("#lines")]) {
      if (g) g.setAttribute("opacity", networkOpacity);
    }
    stringLayer.setAttribute("opacity", sf.toFixed(3));
    for (const line of layout.lines) {
      const g = stringGroups.get(line.label);
      if (g) g.setAttribute("transform", "translate(0," + bandTop(line.label).toFixed(1) + ")");
    }
    // Sizes the box and grows the painted background with it -- without that
    // the extra rows would sit on whatever is behind the SVG.
    setBox(m);
    for (const t of tracks) t.el.setAttribute("d", trackD(t, m, g));

    for (const d of dots) {
      const lp = linXY(d.label, d.node);
      if (!lp && !(g > 0 && d.geoPt)) continue;
      let x = d.mapPt.x, y = d.mapPt.y;
      if (g > 0 && d.geoPt) { x = lerp(x, d.geoPt.x, g); y = lerp(y, d.geoPt.y, g); }
      if (m > 0 && lp) { x = lerp(x, lp.x, m); y = lerp(y, lp.y, m); }
      d.el.setAttribute("cx", x.toFixed(1));
      d.el.setAttribute("cy", y.toFixed(1));
      // Interchanges are drawn larger on the map; on a row every stop is a stop.
      d.el.setAttribute("r", lerp(d.r, 3.6, m).toFixed(2));
    }

    for (const t of texts) {
      // The renderer solved the halo against the schematic map, so it is drawn
      // there and on no other view: on the geographic map the label has been
      // carried off its slot, and beside a row it has no line to cross.
      t.el.classList.toggle("haloed", !!(t.primary && t.spec.halo) && m === 0 && sf === 0 && g === 0);
      const lp = linXY(t.label, t.node);
      if (!lp && !(g > 0)) continue;
      // Label boxes are solved against the drawn map, so on the geographic one
      // they are in the wrong place -- but only by however far their station
      // moved. Carrying each label by that offset keeps it attached to its stop
      // instead of fading the names out exactly when a reader wants to read a
      // route along them. Collisions are possible; a figure that shows the
      // geographic view is showing one line, where there are none.
      let sx = t.spec.x, sy = t.spec.y;
      if (g > 0 && geoData) {
        const gp = geoData.nodes[t.node], mp = mapXY.get(t.node);
        if (gp && mp) { sx += (gp[0] - mp.x) * g; sy += (gp[1] - mp.y) * g; }
      }
      const x = lp ? lerp(sx, lp.x + 7, m) : sx;
      const y = lp ? lerp(sy, lp.y - 9, m) : sy;
      const r0 = t.spec.rotate ? +t.spec.rotate[1] : 0;
      const rot = lerp(r0, -55, m);
      t.el.setAttribute("x", x.toFixed(1));
      t.el.setAttribute("y", y.toFixed(1));
      t.el.setAttribute("text-anchor", m > 0.5 ? "start" : t.spec.anchor);
      t.el.setAttribute("transform",
        "rotate(" + rot.toFixed(1) + " " + x.toFixed(1) + " " + y.toFixed(1) + ")");
      t.el.setAttribute("opacity", (t.primary ? 1 : m).toFixed(2));
    }

    sizeStage();
    for (const n of names) {
      const base = rowPos.get(n.label) || 0;
      n.el.setAttribute("x", (vbX + GUTTER - 14).toFixed(1));
      // In the chart a line occupies a whole band, so its name centres on it.
      const rowLine = vbY + LABEL_RISE + band * (base + 0.15);
      const rowBand = bandTop(n.label) + bandInner() / 2;
      const y = lerp(rowLine, rowBand, sf);
      n.el.setAttribute("y", y.toFixed(1));
      // Times the line's fade, which is exactly 1 while no trip is shown.
      n.el.setAttribute("opacity", (Math.max(m, sf) * fadeOf(n.label)).toFixed(2));
      // From 3 past the name's end to 3 short of the band, on the name's middle.
      n.swatch.setAttribute("x", (vbX + GUTTER - 11).toFixed(1));
      n.swatch.setAttribute("y", (y - n.swatch.getAttribute("height") / 2).toFixed(1));
      n.swatch.setAttribute("opacity", (sf * fadeOf(n.label)).toFixed(2));
    }
  }

  // Where a trip's train is at time t in the view now showing (the map, the rows
  // and the chart blended as the three tweens have them), or null where that
  // view draws no train for it. The dot and every copy of it are placed here.
  function placeAt(trip, path, t, m, sf, gf) {
    const f = stopAt(trip.k, t);
    const lo = Math.min(Math.floor(f), path.stops.length - 1);
    const hi = Math.min(lo + 1, path.stops.length - 1);
    const frac = f - lo;

    let x, y;
    if (m < 1) {
      const el = pathEls[trip.p];
      const len = lerp(path.stops[lo], path.stops[hi], frac);
      const pt = el.getPointAtLength(Math.min(len, el.getTotalLength()));
      x = pt.x; y = pt.y;
      // The same fraction of the same hop, measured along the geographic
      // route instead. Reading the stop index once and placing it twice is
      // what stops a train drifting off its own line mid-morph.
      if (gf > 0 && geoPathEls[trip.p]) {
        const gel = geoPathEls[trip.p];
        const glen = lerp(path.gstops[lo], path.gstops[hi], frac);
        const gp = gel.getPointAtLength(Math.min(glen, gel.getTotalLength()));
        x = lerp(x, gp.x, gf); y = lerp(y, gp.y, gf);
      }
    }
    if (m > 0) {
      const a = linXY(trip.r, path.nodes[lo]), b = linXY(trip.r, path.nodes[hi]);
      if (a && b) {
        const lx = lerp(a.x, b.x, frac), ly = lerp(a.y, b.y, frac);
        x = m < 1 ? lerp(x, lx, m) : lx;
        y = m < 1 ? lerp(y, ly, m) : ly;
      } else if (m >= 1) {
        return null;   // no row for this stop; hide rather than draw a lie
      }
    }
    if (sf > 0) {
      // On the chart a train rides its own diagonal, at the playhead.
      const ya = stopY(trip.r, path.nodes[lo]), yb = stopY(trip.r, path.nodes[hi]);
      if (ya === null || yb === null) { if (sf >= 1) return null; }
      else {
        const sx = timeX(t);
        const sy = bandTop(trip.r) + lerp(ya, yb, frac);
        x = sf < 1 ? lerp(x, sx, sf) : sx;
        y = sf < 1 ? lerp(y, sy, sf) : sy;
      }
    }
    return { x: x, y: y };
  }

  // Whether the train is standing at a station at time t: between a stop's
  // arrival and its departure, which the keyframes hold as two with one stop
  // index. A train passing a stop with no dwell is not standing at it.
  function dwellingAt(keys, t) {
    let lo = 0, hi = keys.length - 1;
    if (t < keys[0][0] || t >= keys[hi][0]) return false;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (keys[mid][0] <= t) lo = mid; else hi = mid;
    }
    return keys[lo][1] === keys[hi][1];
  }

  // The four copies of one train, made when it first has them and placed at
  // every draw from the clock the page keeps, so advance() and seek() put them
  // exactly where the stepped clock says. In the Time view they fade out with
  // the tween that brings the chart in, and a line route mode has faded takes
  // its copies with it.
  function placeCopies(i, trip, path, m, sf, gf) {
    let els = copies.get(i);
    if (!els) {
      els = TRAIL_OPACITY.map((_, n) => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("r", DOT_R);
        c.setAttribute("fill", data.lines[trip.r] || "#333");
        c.setAttribute("data-trip", i);
        c.setAttribute("data-step", n + 1);
        trailLayer.appendChild(c);
        return c;
      });
      copies.set(i, els);
    }
    const fade = (1 - sf) * fadeOf(trip.r);
    els.forEach((c, n) => {
      const at = placeAt(trip, path, now - (n + 1) * TRAIL * speed / TRAIL_OPACITY.length,
                         m, sf, gf);
      if (at) {
        c.setAttribute("cx", at.x.toFixed(1));
        c.setAttribute("cy", at.y.toFixed(1));
      }
      const opacity = at ? (TRAIL_OPACITY[n] * fade).toFixed(3) : "0";
      if (c.getAttribute("opacity") !== opacity) c.setAttribute("opacity", opacity);
    });
  }
  function dropCopies(i) {
    const els = copies.get(i);
    if (!els) return;
    for (const c of els) c.remove();
    copies.delete(i);
  }

  function draw() {
    const m = ease(view), sf = ease(str), gf = ease(geo);
    if (fadeDirty) { applyFade(); fadeDirty = false; }
    if (dirty) {
      geometry(m, sf, gf); dirty = false;
      if (pickCursor) placePick();
    }
    if (sf > 0) {
      const hx = timeX(now);
      playhead.setAttribute("x1", hx.toFixed(1));
      playhead.setAttribute("x2", hx.toFixed(1));
      playhead.setAttribute("y1", (vbY + LABEL_RISE - 24).toFixed(1));
      playhead.setAttribute("y2", (vbY + LABEL_RISE + band * nLines).toFixed(1));
    }

    const alive = new Set();
    shown = 0;
    // Whether the trail shows at all this frame (see TRAIL). It is as long as
    // the playback speed makes it, whether the clock is running or a reader
    // has paused or scrubbed it, so at a speed of 0 it has no length and no
    // copies; the Time view has none; and reduced motion takes it away from
    // everything but a capture.
    const trailing = TRAIL > 0 && speed > 0 && sf < 1 && (!quietFade || capture);
    for (let i = lowerBound(now); i < trips.length; i++) {
      if (starts[i] > now) break;
      if (ends[i] < now) continue;
      const trip = trips[i];
      if (hidden.has(trip.r)) continue;
      const path = data.paths[trip.p];

      const at = placeAt(trip, path, now, m, sf, gf);
      if (!at) continue;
      const x = at.x, y = at.y;

      let dot = nodes.get(i);
      if (!dot) {
        dot = document.createElementNS(NS, "circle");
        dot.setAttribute("r", DOT_R);
        dot.setAttribute("class", "train");
        dot.setAttribute("fill", data.lines[trip.r] || "#333");
        const title = document.createElementNS(NS, "title");
        title.textContent = display(trip.r) + (trip.h ? " to " + trip.h : "");
        dot.appendChild(title);
        layer.appendChild(dot);
        nodes.set(i, dot);
      }
      dot.setAttribute("cx", x.toFixed(1));
      dot.setAttribute("cy", y.toFixed(1));
      // A train on a line off the trip fades with its line; no trip, no write.
      if (fadeAt.has(trip.r)) dot.setAttribute("opacity", fadeAt.get(trip.r).toFixed(3));
      else if (dot.hasAttribute("opacity")) dot.removeAttribute("opacity");
      alive.add(i);
      shown++;
      if (trailLayer) {
        if (trailing && !dwellingAt(trip.k, now)) placeCopies(i, trip, path, m, sf, gf);
        else dropCopies(i);
      }
    }
    for (const entry of nodes) {
      if (!alive.has(entry[0])) { entry[1].remove(); nodes.delete(entry[0]); }
    }
    if (trailLayer) for (const i of [...copies.keys()]) if (!alive.has(i)) dropCopies(i);
    const when = fmt(now);
    clock.textContent = when;
    // A range speaks its value; the scrub's is a time, not a count of seconds.
    // Written when it changes, which is once a sim-minute, not every frame.
    if (scrub.getAttribute("aria-valuetext") !== when) scrub.setAttribute("aria-valuetext", when);
    // The word is appended in CSS so a phone can hide it and keep the number.
    count.textContent = shown;
    // Present mode's overlay redraws here rather than on its own rAF loop: a
    // capture steps the clock by hand, and a separate loop would not be
    // guaranteed to run between a step and its screenshot.
    if (onDraw) onDraw();
  }

  // A tween is either the page's own exponential decay -- which feels right
  // under a hand but is asymptotic, settling only when it crosses an epsilon --
  // or, when a duration is set, a linear ramp of known length. Capture needs
  // the second: a beat shorter than the decay's ~130 frames would otherwise be
  // cut off mid-transition. draw() eases the result either way, so the ramp
  // arrives as a cubic in-out rather than as constant motion.
  let viewTween = null, strTween = null, geoTween = null;   // {from, to, t, dur}

  function tween(cur, target, state, dt, rate) {
    if (cur === target) return cur;
    if (state && state.dur > 0) {
      state.t += dt;
      const p = Math.min(state.t / state.dur, 1);
      return state.from + (state.to - state.from) * p;
    }
    const next = cur + (target - cur) * (reduced ? 1 : Math.min(dt * rate, 1));
    return Math.abs(target - next) < 0.001 ? target : next;
  }

  function advance(dt) {
    // The clock holds while the network draws in; a view's morph does not.
    if (playing && !drawing) {
      now += dt * speed;
      // Wrapping mid-capture is a hard cut in the middle of a clip; a storyboard
      // is responsible for staying inside the service day.
      if (now > t1) now = present ? t1 : t0;
      scrub.value = now;
    }
    // The view tween and the row tween both mark geometry dirty; once both have
    // settled the per-frame cost drops back to moving the trains.
    if (view !== viewTarget) {
      view = tween(view, viewTarget, viewTween, dt, 3.2);
      if (view === viewTarget) viewTween = null;
      dirty = true;
    }
    if (str !== strTarget) {
      str = tween(str, strTarget, strTween, dt, 3.2);
      if (str === strTarget) strTween = null;
      dirty = true;
    }
    if (geo !== geoTarget) {
      geo = tween(geo, geoTarget, geoTween, dt, 3.2);
      if (geo === geoTarget) geoTween = null;
      dirty = true;
    }
    for (const entry of rowTarget) {
      const label = entry[0], target = entry[1];
      const cur = rowPos.get(label);
      if (cur !== target) {
        const next = reduced ? target : cur + (target - cur) * Math.min(dt * 6, 1);
        rowPos.set(label, Math.abs(target - next) < 0.002 ? target : next);
        dirty = true;
      }
    }
    // The rows' names fade in geometry(), so a moving fade marks it dirty.
    if (stepFade(dt, false)) dirty = true;
  }

  function frame(ts) {
    const dt = Math.min((ts - last) / 1000, 0.25);
    last = ts;
    advance(dt);
    draw();
    // Capture drives the clock itself, one advance() per emitted frame, so the
    // real-time loop must not also be running.
    rafId = capture ? null : requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- controls
  const playBtn = document.getElementById("play");
  const announce = document.getElementById("announce");
  // The button names what pressing it does, so it carries no pressed state.
  const showPlay = () => { playBtn.textContent = playing ? "Pause" : "Play"; };
  showPlay();     // read at boot: under reduced motion the page starts paused
  playBtn.onclick = () => setPlaying(!playing);
  // The one place the playing state is set, with the button's word and what is
  // said about it, so the header always says what the next press does. The
  // button and the seam's setPlaying both come here: a script driving the seam
  // leaves the header as true as a press does. A repeat sets the same word and
  // the same text again, which a reader does not say twice.
  function setPlaying(on) {
    playing = on;
    showPlay();
    // The one thing said without focus moving, and only when it is asked for.
    announce.textContent = playing ? "Playing" : "Paused";
  }
  scrub.oninput = () => { now = +scrub.value; draw(); };

  // One button showing the current rate, tapped to cycle. Four buttons for a
  // single value cost four times the width and said no more.
  const SPEEDS = [1, 60, 240, 900];
  let speedIdx = SPEEDS.indexOf(speed);
  if (speedIdx < 0) speedIdx = 1;
  const speedBtn = document.getElementById("speed");
  const showSpeed = () => {
    speed = SPEEDS[speedIdx];
    speedBtn.textContent = speed + "\u00d7";
    speedBtn.setAttribute("aria-label", "Playback speed " + speed + "\u00d7");
    speedBtn.title = "Playback speed \u2014 tap to cycle";
  };
  speedBtn.onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; showSpeed(); };
  showSpeed();

  // The secondary controls, open where there is room and folded away on a
  // phone. Same markup either way.
  const moreBtn = document.getElementById("more");
  const morePanel = document.getElementById("more-panel");
  const setMore = open => {
    morePanel.hidden = !open;
    moreBtn.setAttribute("aria-expanded", String(open));
    moreBtn.innerHTML = open ? 'Less <span aria-hidden="true">&#9652;</span>'
                             : 'More <span aria-hidden="true">&#9662;</span>';
    dirty = true;
  };
