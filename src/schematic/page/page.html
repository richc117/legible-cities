  moreBtn.onclick = () => setMore(morePanel.hidden);

  const labelsBtn = document.getElementById("labels-toggle");
  // setBox already knows that the tight box only applies to the map, so this is
  // just "recompute the box on the next frame".
  const syncBox = () => { dirty = true; };
  const setLabels = on => {
    labelsOn = on;
    labelsBtn.setAttribute("aria-pressed", String(labelsOn));
    textLayer.style.display = labelsOn ? "" : "none";
    syncBox();
  };
  labelsBtn.onclick = () => setLabels(!labelsOn);

  const sortGroup = document.getElementById("sort-group");
  const viewBtns = {
    map: document.getElementById("view-map"),
    linear: document.getElementById("view-linear"),
    string: document.getElementById("view-string"),
  };
  const geoBtn = document.getElementById("view-geo");
  // A page built without the geographic geometry has nothing to show for that
  // button, and setGeo is a documented no-op there. Drop it rather than leave a
  // control that does nothing.
  if (!geoData) geoBtn.remove();

  // The switcher shows four choices over two axes -- the geographic one is the
  // map view with `geo` raised -- so pressed state is derived from both, and
  // from the *targets*, so a button lights the moment a morph starts rather
  // than when it lands. Called by setMode and by setGeo, which is what keeps
  // the buttons honest no matter which seam moved the page: a click, the
  // present.js sequence, or bin/_record.js driving an export.
  const syncButtons = () => {
    const pressed = (geoData && geoTarget === 1) ? "geo" : mode;
    if (geoData) geoBtn.setAttribute("aria-pressed", String(pressed === "geo"));
    Object.keys(viewBtns).forEach(k =>
      viewBtns[k].setAttribute("aria-pressed", String(pressed === k)));
  };
  // `dur` is only ever passed by a capture, which needs a transition that lands
  // exactly on a frame boundary. A click leaves it undefined and keeps the
  // page's own feel.
  const setMode = (next, dur) => {
    mode = next;
    const nextView = next === "map" ? 0 : 1;
    const nextStr = next === "string" ? 1 : 0;
    viewTween = dur > 0 && nextView !== view ? { from: view, to: nextView, t: 0, dur } : null;
    strTween = dur > 0 && nextStr !== str ? { from: str, to: nextStr, t: 0, dur } : null;
    viewTarget = nextView;
    strTarget = nextStr;
    syncButtons();
    // Station names belong to the network views; the chart has its own axis.
    sortGroup.hidden = next === "map";
    labelsBtn.hidden = next === "string";
    // So does picking a station: the chart draws none to pick.
    if (pickCursor) pickCursor.hidden = next === "string";
    syncBox();
    dirty = true;
    // The rows and the chart draw no network in, so they show it whole.
    if (drawAsked < 1) showDrawn();
  };
  // The geographic axis: the same network before octi straightened it. A
  // no-op, reported as false, on a page built without that geometry.
  //
  // Three ways to be asked, and they are not the same: an explicit duration
  // runs a timed tween (a capture, or a figure morphing on a beat), an explicit
  // *zero* snaps -- which is how present.js sets the opening state and how a
  // capture lands frame 0 -- and an omitted duration eases at the page's own
  // rate, the way setMode does for a click. Collapsing the last two, as this
  // did while nothing but present.js called it, made the toolbar's Geographic
  // button a hard cut across the whole network.
  function setGeo(on, dur) {
    if (!geoData) return false;
    const to = on ? 1 : 0;
    geoTween = dur > 0 && to !== geo ? { from: geo, to: to, t: 0, dur: dur } : null;
    geoTarget = to;
    if (dur === 0) { geo = to; }
    syncButtons();
    dirty = true; draw();
    return true;
  }

  // How long a click takes to land. A timed tween rather than the rate-based
  // ease the axes fall back to: that one is front-loaded, spending half its
  // travel in the first fifth of a second, which is fine for rows sliding a
  // little and reads as a jump cut when the whole network is moving between two
  // different geographies.
  //
  // Shorter than MORPH in present.js, deliberately. That 1.8s belongs to a
  // figure that morphs on its own, on a loop, while a reader takes it in --
  // there, a slow transformation *is* the content. A click is a reader asking
  // for something, and waiting on an answer you already asked for feels slower
  // than watching the same motion unprompted. Same S-curve, less of it.
  const CLICK_MORPH = 1.2;
  // A click is a reader asking, and a reader who asked for no motion gets the
  // view at once: neither the morph nor the fade into the time chart runs. Zero
  // is a snap, as present.js uses it; `reduced` is false in present mode.
  const CLICK_DUR = reduced ? 0 : CLICK_MORPH;

  // Every button sets both axes: naming a view says where the network is as
  // well as how it is laid out. Both tweens run over the same window, so
  // Geographic -> Linear morphs the two together, which the interpolation in
  // trackD(t, m, g) already handles.
  Object.keys(viewBtns).forEach(k => {
    viewBtns[k].onclick = () => { setGeo(false, CLICK_DUR); setMode(k, CLICK_DUR); };
  });
  if (geoData) {
    geoBtn.onclick = () => { setGeo(true, CLICK_DUR); setMode("map", CLICK_DUR); };
  }

  // The four public view names, as the URL, the site's switcher and the
  // exporter spell them, mapped onto the two axes. `map` and `schematic` are
  // the same view: the label changed, the key did not, because it is written
  // into every atlas link and every storyboard.
  const showView = (name, dur) => {
    const geoOn = name === "geographic";
    setGeo(geoOn, dur);
    setMode(geoOn ? "map"
          : name === "time" ? "string"
          : name === "schematic" ? "map" : name, dur);
  };
  // What showView would have been passed to reach the state now showing.
  const viewName = () =>
    (geoData && geoTarget === 1) ? "geographic"
      : mode === "string" ? "time" : mode;

  const sortBtns = {
    arranged: document.getElementById("sort-arranged"),
    line: document.getElementById("sort-line"),
    size: document.getElementById("sort-size"),
  };
  const sized = new Map(layout.lines.map(l => [l.label, l.stations]));
  // The order the map was built with, which the engine writes only when it was
  // given one. Without it there is nothing to follow: the third sort stays
  // hidden and the rows start A-Z, as they always did.
  const arrangedAt = new Map((layout.arranged || []).map((l, i) => [l, i]));
  const at = l => arrangedAt.has(l) ? arrangedAt.get(l) : arrangedAt.size;
  const applySort = how => {
    const sorted = order.slice().sort((a, b) =>
      how === "arranged" ? (at(a) - at(b)) || display(a).localeCompare(display(b), undefined, { numeric: true }) :
      how === "size" ? (sized.get(b) - sized.get(a)) || display(a).localeCompare(display(b))
                     : display(a).localeCompare(display(b), undefined, { numeric: true }));
    sorted.forEach((label, i) => rowTarget.set(label, i));
    Object.keys(sortBtns).forEach(k =>
      sortBtns[k].setAttribute("aria-pressed", String(k === how)));
    dirty = true;
  };
  sortBtns.arranged.onclick = () => applySort("arranged");
  sortBtns.line.onclick = () => applySort("line");
  sortBtns.size.onclick = () => applySort("size");
  sortBtns.arranged.hidden = arrangedAt.size === 0;
  applySort(arrangedAt.size ? "arranged" : "line");
  for (const entry of rowTarget) rowPos.set(entry[0], entry[1]);

  const lines = document.getElementById("line-toggles");
  const lineCount = document.getElementById("line-count");
  const chips = new Map();

  // One place decides what a hidden line means, across all three views. It was
  // setRoute, one letter from the seam's setRoutes, beside which setTrip now
  // stands: names for lines and for a trip that a reader could not tell apart.
  const setLineShown = (r, on) => {
    if (on) hidden.delete(r); else hidden.add(r);
    const off = on ? "" : "none";
    const chip = chips.get(r);
    if (chip) chip.setAttribute("aria-pressed", String(on));
    svg.querySelectorAll('#lines g.line[data-line="' + r + '"]')
       .forEach(g => g.style.display = off);
    for (const d of dots) if (d.label === r) d.el.style.display = off;
    for (const t of texts) if (t.label === r) t.el.style.display = off;
    for (const n of names) if (n.label === r) n.el.style.display = n.swatch.style.display = off;
    const sg = stringGroups.get(r);
    if (sg) sg.style.display = off;
    lineCount.textContent = (routes.length - hidden.size) + " of " + routes.length;
    // A draw-in under way is laid out again over the lines now shown.
    if (drawing) replanDrawn();
  };

  // The two grounds a chip's dot sits on: the --bg of each theme above, written
  // out because the script cannot read a theme that is not showing (a test holds
  // the two to the stylesheet). A dot is marked with every theme it is under 3:1
  // in, since the theme can change in place.
  const GROUNDS = { "warm-dark": "#15120f", "sepia": "#f7efe1" };
  const luminance = hex => {
    const [r, g, b] = [1, 3, 5].map(i => {
      const c = parseInt(hex.slice(i, i + 2), 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const contrast = (a, b) => {
    const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
    return (hi + 0.05) / (lo + 0.05);
  };
  // A colour that is not #rrggbb cannot be measured, and is ringed in both.
  const weakIn = colour => Object.keys(GROUNDS).filter(theme =>
    !/^#[0-9a-f]{6}$/i.test(colour) || contrast(colour, GROUNDS[theme]) < 3).join(" ");

  for (const r of routes) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.setAttribute("role", "button");
    chip.setAttribute("tabindex", "0");
    chip.setAttribute("aria-pressed", "true");
    // Built as nodes, not markup: both halves come from an agency's feed --
    // the label and the colour -- and a line named with a tag would run here.
    const dot = document.createElement("span");
    dot.className = "dot";
    const weak = weakIn(data.lines[r] || "#333");
    if (weak) dot.setAttribute("data-weak", weak);
    dot.style.background = data.lines[r] || "#333";
    chip.append(dot, display(r));
    const toggle = () => {
      setLineShown(r, chip.getAttribute("aria-pressed") !== "true");
      answerTripAgain();
      draw();
    };
    chip.onclick = toggle;
    chip.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        // A held key is one press. A toggle that repeated with it would end up
        // wherever the key happened to be let go.
        if (!e.repeat) toggle();
      }
    };
    chips.set(r, chip);
    lines.appendChild(chip);
  }
  document.getElementById("lines-all").onclick = () => {
    for (const r of routes) setLineShown(r, true);
    answerTripAgain();
    draw();
  };
  document.getElementById("lines-none").onclick = () => {
    for (const r of routes) setLineShown(r, false);
    answerTripAgain();
    draw();
  };
  lineCount.textContent = routes.length + " of " + routes.length;

  // ------------------------------------------------------------------ a trip
  // Route mode (engine issue 49, app ADR-048): two stations in, the trip
  // between them out, found here so that the page gives one answer wherever it
  // runs: in the desktop app, on the site and in the essay. Asked for through
  // the seam's setTrip and, off present mode, by picking two stations.
  //
  // The graph is the one the map draws, read back off the drawing as the
  // stations are: every track is one line's run between two nodes, and a node
  // with a dot is a station. What the drawing cannot say comes beside the data
  // (#routing, written by animate.route_rules): a turn a line does not make at
  // a node (LOOM's excluded_conn, from one neighbour on to another, in that
  // direction) and a station a line passes without stopping (not_serving).
  // Never the timetable.
  //
  // The cost is stops plus CHANGE_PENALTY for every boarding after the first.
  // A stop is a station the line calls at, and a leg's stops are counted after
  // boarding, the alighting one included. Of two trips that cost the same, the
  // one with fewer changes is taken, then the one whose lines' labels, in the
  // order it rides them, come first, then the one whose boarding stations' ids
  // do, both compared as code units, so a call made twice, or in another
  // browser, gives one answer. A train never turns back on itself at a node. A
  // change is at a station both lines serve, and may be onto the line's own
  // trains, so a turn LOOM says a line does not make is, at a station, a change
  // of trains, and never ridden through.
  //
  // not_serving is advisory: trusted, it parts an eighth of the registry's
  // station pairs. So a trip is found first with it honoured -- a line neither
  // boards nor alights at a station it does not serve, and passing one is not
  // a stop -- and only when that finds none is it found again as though every
  // line stopped at every station it passes, with `reason` saying so.
  //
  // A line hidden on the page (a chip, setRoutes) is never ridden, and when no
  // trip is left without it the answer says so and names the lines hidden. A
  // line the map was built without (map.build's `hidden`) is not on the page
  // at all: no trip can ride it, and the page cannot name it.
  const CHANGE_PENALTY = 4;
  // The lowest rung of the page's own ladder (the time chart's busiest lines).
  const TRIP_FADE = 0.16;
  const SEP = "\u0000";
  const byUnits = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  const isStation = id => typeof id === "string" && mapXY.has(id);

  const routing = (() => {
    try { return JSON.parse(document.getElementById("routing").textContent) || {}; }
    catch (e) { return {}; }
  })();
  const unserved = new Map(Object.entries(routing.unserved || {})
    .map(entry => [entry[0], new Set(entry[1])]));
  const barred = new Set();
  for (const [node, turns] of Object.entries(routing.excluded || {})) {
    for (const t of turns) barred.add([node, t[0], t[1], t[2]].join(SEP));
  }
  const turnBarred = (node, line, from, to) => barred.has([node, line, from, to].join(SEP));

  // node -> [{ line, to }], one entry a line and neighbour, by label then node.
  const runsAt = new Map();
  {
    const found = new Map();
    for (const t of tracks) {
      if (t.src === t.dst) continue;
      for (const [a, b] of [[t.src, t.dst], [t.dst, t.src]]) {
        if (!found.has(a)) found.set(a, new Map());
        found.get(a).set(t.label + SEP + b, { line: t.label, to: b });
      }
    }
    for (const [node, runs] of found) {
      runsAt.set(node, [...runs.values()].sort((x, y) => byUnits(x.line, y.line) || byUnits(x.to, y.to)));
    }
  }
  const aheadOn = (line, node) => (runsAt.get(node) || []).filter(r => r.line === line).map(r => r.to);
  // node -> the lines through it, by label.
  const linesAt = new Map([...runsAt].map(entry =>
    [entry[0], [...new Set(entry[1].map(r => r.line))]]));

  // The least first: the cost, then the changes, the labels and the boardings.
  const listOrder = (a, b) => {
    for (let i = 0; i < a.length && i < b.length; i++) {
      const o = byUnits(a[i], b[i]);
      if (o) return o;
    }
    return a.length - b.length;
  };
  const tripOrder = (a, b) => a.cost - b.cost || a.changes - b.changes
    || listOrder(a.lines, b.lines) || listOrder(a.boards, b.boards);
  // Then the order offered, so that two ways equal in all four leave the heap
  // in the same order every time.
  const heapOrder = (a, b) => tripOrder(a.key, b.key) || a.key.n - b.key.n;
  function heapPush(heap, item) {
    heap.push(item);
    for (let i = heap.length - 1; i > 0;) {
      const up = (i - 1) >> 1;
      if (heapOrder(heap[i], heap[up]) >= 0) break;
      [heap[i], heap[up]] = [heap[up], heap[i]];
      i = up;
    }
  }
  function heapPop(heap) {
    const top = heap[0], end = heap.pop();
    if (heap.length) {
      heap[0] = end;
      for (let i = 0;;) {
        const l = 2 * i + 1, r = l + 1;
        let least = i;
        if (l < heap.length && heapOrder(heap[l], heap[least]) < 0) least = l;
        if (r < heap.length && heapOrder(heap[r], heap[least]) < 0) least = r;
        if (least === i) break;
        [heap[i], heap[least]] = [heap[least], heap[i]];
        i = least;
      }
    }
    return top;
  }

  // The cheapest trip from one station to another, as legs, or null. A state is
  // a node, the line ridden and the node it came from, which is what a turn
  // LOOM forbids depends on. `honour` is whether not_serving is trusted, and
  // `shut` the lines not to ride.
  function route(from, to, honour, shut) {
    const serves = (line, node) => mapXY.has(node)
      && !(honour && unserved.has(node) && unserved.get(node).has(line));
    const best = new Map(), back = new Map(), heap = [];
    let offered = 0;
    const offer = (state, key, before) => {
      const id = state.node + SEP + state.line + SEP + (state.prev === null ? "" : state.prev);
      const had = best.get(id);
      if (had && tripOrder(key, had) >= 0) return;
      key.n = offered++;
      best.set(id, key);
      back.set(id, { state: state, before: before });
      heapPush(heap, { key: key, state: state, id: id });
    };
    for (const run of runsAt.get(from) || []) {
      if (shut.has(run.line) || !serves(run.line, from)) continue;
      offer({ node: from, line: run.line, prev: null },
            { cost: 0, changes: 0, lines: [run.line], boards: [from] }, null);
    }
    while (heap.length) {
      const { key, state, id } = heapPop(heap);
      if (best.get(id) !== key) continue;      // a better way here was found since
      const { node, line, prev } = state;
      if (node === to && serves(line, to)) return legsOf(id, back, serves);
      for (const run of runsAt.get(node) || []) {
        if (run.line !== line) continue;
        if (run.to === prev || (prev !== null && turnBarred(node, line, prev, run.to))) continue;
        offer({ node: run.to, line: line, prev: node },
              { cost: key.cost + (serves(line, run.to) ? 1 : 0), changes: key.changes,
                lines: key.lines, boards: key.boards }, id);
      }
      // A change: off the line and onto any line that serves the station, its
      // own included, so a turn the line does not make is a change of trains.
      if (node !== from && serves(line, node)) {
        for (const other of linesAt.get(node)) {
          if (shut.has(other) || !serves(other, node)) continue;
          offer({ node: node, line: other, prev: null },
                { cost: key.cost + CHANGE_PENALTY, changes: key.changes + 1,
                  lines: key.lines.concat(other), boards: key.boards.concat(node) }, id);
        }
      }
    }
    return null;
  }

  // A leg begins at every boarding: the first state, and each after a change.
  function legsOf(id, back, serves) {
    const states = [];
    for (let at = id; at !== null; at = back.get(at).before) states.push(back.get(at).state);
    states.reverse();
    const legs = [];
    for (const s of states) {
      if (s.prev === null) legs.push({ line: s.line, nodes: [s.node] });
      else legs[legs.length - 1].nodes.push(s.node);
    }
    return legs.map(l => ({
      line: l.line, towards: towards(l.line, l.nodes),
      board: l.nodes[0], alight: l.nodes[l.nodes.length - 1],
      stops: l.nodes.slice(1).filter(n => serves(l.line, n)).length,
      nodes: l.nodes,
    }));
  }

  // Each line's spine, node -> its place along it (linear.spine, the line's
  // longest run, whose two ends are the ends the map draws).
  const spines = new Map(layout.lines.map(l =>
    [l.label, new Map(((l.rows[0] || {}).nodes || []).map((pair, i) => [pair[0], i]))]));
  // A loop is a line whose nodes make one cycle: two neighbours each, all joined.
  const loops = new Map();
  function isLoop(line) {
    if (!loops.has(line)) {
      const on = [...runsAt.keys()].filter(n => aheadOn(line, n).length);
      let ring = on.length > 2 && on.every(n => aheadOn(line, n).length === 2);
      if (ring) {
        const reached = new Set([on[0]]), queue = [on[0]];
        while (queue.length) {
          for (const n of aheadOn(line, queue.pop())) {
            if (!reached.has(n)) { reached.add(n); queue.push(n); }
          }
        }
        ring = reached.size === on.length;
      }
      loops.set(line, ring);
    }
    return loops.get(line);
  }
  // Where a leg is heading: the end of its line that riding on past where it
  // alights reaches, never a headsign. Ridden on along the line's own track
  // through the turns it makes; where the track forks it keeps to the line's
  // spine, and coming onto the spine from a branch it takes the side with more
  // of the spine left, the start's side on a tie (anywhere else, the smaller
  // node id). Where nothing lies beyond the alighting station, it is that one.
  // On a loop, which has no end, it is the first station after boarding.
  function towards(line, path) {
    if (isLoop(line)) return path.slice(1).find(n => mapXY.has(n)) || path[path.length - 1];
    const spine = spines.get(line) || new Map(), last = spine.size - 1;
    const seen = new Set(path);
    let prev = path[path.length - 2], here = path[path.length - 1], end = here;
    for (;;) {
      const from = prev, at = here;
      const ahead = aheadOn(line, at)
        .filter(n => !seen.has(n) && !turnBarred(at, line, from, n)).sort(byUnits);
      if (!ahead.length) break;
      const on = ahead.filter(n => spine.has(n));
      const left = n => (!spine.has(at) ? Math.max(spine.get(n), last - spine.get(n))
        : spine.get(n) > spine.get(at) ? last - spine.get(n) : spine.get(n));
      const next = on.length > 1
        ? on.sort((a, b) => left(b) - left(a) || spine.get(a) - spine.get(b))[0]
        : (on[0] || ahead[0]);
      seen.add(next);
      prev = at;
      here = next;
      if (mapXY.has(here)) end = here;
    }
    return end;
  }

  // The answer for two stations: always an object, with legs or with a reason.
  function findTrip(from, to) {
    const answer = (reason, more) => ({
      trip: Object.assign({ from: from, to: to, legs: null, changes: 0, reason: reason }, more),
      legs: null });
    if (!isStation(from)) return answer("the start is not a station on this map");
    if (!isStation(to)) return answer("the end is not a station on this map");
    if (from === to) return answer("start and end are the same station");
    const shut = new Set(hidden), none = new Set();
    let legs = route(from, to, true, shut), caveat = null;
    if (!legs) {
      legs = route(from, to, false, shut);
      if (legs) caveat = "a stop on this trip is one the map's data says its line does not make";
    }
    if (!legs) {
      if (shut.size && (route(from, to, true, none) || route(from, to, false, none))) {
        return answer("no trip without hidden lines", { hidden: [...shut].sort(byUnits) });
      }
      return answer("no trip joins these stations");
    }
    const trip = {
      from: from, to: to,
      legs: legs.map(l => ({ line: l.line, towards: l.towards, board: l.board,
                             alight: l.alight, stops: l.stops })),
      changes: legs.length - 1,
    };
    if (caveat) trip.reason = caveat;
    if (shut.size) trip.hidden = [...shut].sort(byUnits);
    return { trip: trip, legs: legs };
  }

  let tripAsked = null;      // the two stations last asked for, or null
  let tripAnswer = null;     // what state().trip says: null, a trip or a reason
  let pickFrom = null;       // a start picked on the page, waiting for its end
  let pickAt = null;         // the station the cursor is on
  let placePick = () => {};  // puts the cursor over its dot while it has focus
  let tripPanel = null;      // the steps, off present mode only
  const tripCopy = () => (tripAnswer ? JSON.parse(JSON.stringify(tripAnswer)) : null);

  function setTrip(from, to) {
    pickFrom = null;
    askTrip(from, to);
    return tripCopy();
  }
  function askTrip(from, to) {
    tripAsked = from === null || from === undefined ? null : { from: from, to: to === undefined ? null : to };
    answerTrip();
  }
  // A trip asked for is answered again whenever the lines shown change.
  function answerTripAgain() {
    if (tripAsked) answerTrip();
  }
  function answerTrip() {
    const found = tripAsked ? findTrip(tripAsked.from, tripAsked.to) : null;
    tripAnswer = found ? found.trip : null;
    const legs = found && found.legs;
    tripRidden = legs ? new Set(legs.map(l => l.line)) : null;
    tripPassed = legs ? new Set([].concat(...legs.map(l => l.nodes)).filter(isStation)) : null;
    showTrip();
  }

  // What the trip changes on the map, which is nothing while an exporter
  // drives the page, so no captured frame can hold one. Under reduced motion
  // the fade lands at once. `reduced` is false in present mode, where an
  // export's transitions must stay transitions, but the fade never runs while
  // capturing, so the reader's wish holds in present mode too: the mode the
  // desktop app's viewer runs the page in.
  const quietFade = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Everything keyed to a line: its group, its dots and its band in the time
  // chart. Its trains are faded in draw() and its row's name in geometry(),
  // which write them every frame anyway.
  const lineParts = new Map();
  const partOf = (label, el) => {
    if (!lineParts.has(label)) lineParts.set(label, []);
    lineParts.get(label).push(el);
  };
  svg.querySelectorAll("#lines g.line").forEach(g => partOf(g.getAttribute("data-line"), g));
  for (const d of dots) partOf(d.label, d.el);
  for (const [label, g] of stringGroups) partOf(label, g);
  const fadeTarget = label =>
    (tripRidden && !capture && !tripRidden.has(label) ? TRIP_FADE : 1);
  // One step of the fade, or all of it at once. True when anything moved.
  function stepFade(dt, snap) {
    if (!tripRidden && !fadeAt.size) return false;
    let moved = false;
    for (const label of lineParts.keys()) {
      const was = fadeOf(label), target = fadeTarget(label);
      if (was === target) continue;
      let next = snap || quietFade ? target : was + (target - was) * Math.min(dt * 6, 1);
      if (Math.abs(target - next) < 0.002) next = target;
      if (next === 1) fadeAt.delete(label); else fadeAt.set(label, next);
      moved = true;
    }
    if (moved) fadeDirty = true;
    return moved;
  }
  function applyFade() {
    for (const [label, parts] of lineParts) {
      const at = fadeAt.has(label) ? fadeAt.get(label).toFixed(3) : null;
      for (const el of parts) {
        if (at !== null) el.setAttribute("opacity", at);
        else if (el.hasAttribute("opacity")) el.removeAttribute("opacity");
      }
    }
  }
  // Station names off the trip are hidden, not faded, and kept by station: the
  // map draws one opaque name per station, and it may sit on a line off the trip.
  function applyNames() {
    const keep = tripPassed && !capture ? tripPassed : null;
    for (const t of texts) {
      if (keep && !keep.has(t.node)) t.el.setAttribute("visibility", "hidden");
      else if (t.el.hasAttribute("visibility")) t.el.removeAttribute("visibility");
    }
  }
  function showTrip() {
    applyNames();
    if (capture || quietFade) stepFade(0, true);
    fadeDirty = true;
    dirty = true;
    draw();
    if (tripPanel) tripPanel.show();
  }

  // ------------------------------------------------- picking a trip on the page
  // For the site, where nothing but the page runs: a station is picked by a
  // press on or near its dot, or by keyboard with the station cursor, the first
  // pick the start and the second the end; Escape, or the panel's button, shows
  // the whole network again. Built off present mode only, so present mode and
  // every export have none of it. The cursor and the panel are an aside of
  // their own after the stage: inside the stage the cursor would stop the
  // browser making the stage a Tab stop, and inside the image it would be a
  // control in a picture.
  if (!present) buildPicking();
  function buildPicking() {
    const nameOf = n => (layout.names || {})[n] || n;
    const dotsOf = new Map();
    for (const d of dots) {
      if (!dotsOf.has(d.node)) dotsOf.set(d.node, []);
      dotsOf.get(d.node).push(d);
    }
    // Each station once, at its first dot, and A to Z for the letter keys.
    const byName = [...dotsOf.keys()].sort((a, b) =>
      nameOf(a).localeCompare(nameOf(b), undefined, { numeric: true }) || byUnits(a, b));
    if (!byName.length) return;
    const shownAt = n => dotsOf.get(n).some(d => d.el.style.display !== "none");
    const at = n => {
      const el = dotsOf.get(n)[0].el;
      return [+el.getAttribute("cx"), +el.getAttribute("cy")];
    };

    const aside = document.createElement("aside");
    aside.id = "trip";
    aside.setAttribute("aria-label", "Trip");
    const cursor = document.createElement("button");
    cursor.id = "station-pick";
    cursor.type = "button";
    cursor.setAttribute("aria-describedby", "trip-help");
    const label = document.createElement("span");
    label.className = "sr-only";
    cursor.appendChild(label);
    const help = document.createElement("p");
    help.id = "trip-help";
    help.className = "sr-only";
    help.textContent = "Plan a trip on the map. The arrow keys move between stations, a letter "
      + "goes to the next station whose name starts with it, Enter picks where the trip "
      + "starts and then where it ends, and Escape shows the whole network.";
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.hidden = true;
    const note = document.createElement("p");
    const steps = document.createElement("ol");
    const after = document.createElement("p");
    const clear = document.createElement("button");
    clear.id = "trip-clear";
    clear.type = "button";
    clear.textContent = "Show the whole network";
    panel.append(note, steps, after, clear);
    aside.append(cursor, help, panel);
    stage.after(aside);
    pickCursor = cursor;
    cursor.hidden = mode === "string";

    placePick = () => {
      if (document.activeElement !== cursor) return;
      const box = dotsOf.get(pickAt)[0].el.getBoundingClientRect();
      const half = cursor.offsetWidth / 2, root = document.documentElement;
      const x = box.left + box.width / 2 + scrollX - half, y = box.top + box.height / 2 + scrollY - half;
      // Held inside the document, so a dot at its edge never widens the page.
      cursor.style.left = Math.max(0, Math.min(x, root.scrollWidth - 2 * half)).toFixed(1) + "px";
      cursor.style.top = Math.max(0, y).toFixed(1) + "px";
    };
    const moveTo = (n, reveal) => {
      pickAt = n;
      label.textContent = nameOf(n);
      if (reveal) dotsOf.get(n)[0].el.scrollIntoView({ block: "nearest", inline: "nearest" });
      placePick();
    };
    moveTo(byName[0], false);

    // The station nearest along an arrow: ahead of the cursor, and the one
    // least far ahead counting a step aside as two.
    const nearest = (ax, ay) => {
      const [px, py] = at(pickAt);
      let best = null, score = Infinity;
      for (const n of byName) {
        if (n === pickAt || !shownAt(n)) continue;
        const [qx, qy] = at(n), dx = qx - px, dy = qy - py;
        const along = dx * ax + dy * ay;
        if (along <= 0) continue;
        const s = along + 2 * Math.abs(dx * ay - dy * ax);
        if (s < score) { score = s; best = n; }
      }
      return best;
    };
    const byLetter = key => {
      const c = key.toLocaleLowerCase(), i = byName.indexOf(pickAt);
      for (let k = 1; k <= byName.length; k++) {
        const n = byName[(i + k) % byName.length];
        if (shownAt(n) && nameOf(n).toLocaleLowerCase().startsWith(c)) return n;
      }
      return null;
    };
    const pick = n => {
      if (tripAsked || pickFrom === null) {
        pickFrom = n;
        if (tripAsked) askTrip(null);
        else tripPanel.show();
      } else {
        const start = pickFrom;
        pickFrom = null;
        askTrip(start, n);
      }
    };
    const clearTrip = () => {
      pickFrom = null;
      askTrip(null);
    };

    const ARROWS = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] };
    cursor.addEventListener("focus", () => {
      if (!shownAt(pickAt)) {
        const first = byName.find(shownAt);
        if (first) moveTo(first, false);
      }
      placePick();
    });
    // Back to the corner it waits in, so a place left over from a wider window
    // never widens the page.
    cursor.addEventListener("blur", () => { cursor.style.left = cursor.style.top = ""; });
    cursor.addEventListener("keydown", e => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (ARROWS[e.key]) {
        e.preventDefault();
        const n = nearest(ARROWS[e.key][0], ARROWS[e.key][1]);
        if (n) moveTo(n, true);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        // A held key is one pick, as it is one press on a chip.
        if (!e.repeat) pick(pickAt);
      } else if (e.key.length === 1) {
        const n = byLetter(e.key);
        if (n) moveTo(n, true);
      }
    });
    aside.addEventListener("keydown", e => {
      if (e.key === "Escape" && (pickFrom !== null || tripAsked)) {
        e.preventDefault();
        clearTrip();
      }
    });
    clear.onclick = () => { clearTrip(); cursor.focus(); };
    stage.addEventListener("scroll", () => placePick(), { passive: true });

    // A press picks the station whose dot is nearest, within REACH pixels.
    const REACH = 16;
    svg.addEventListener("click", e => {
      if (mode === "string") return;
      const ctm = svg.getScreenCTM();
      if (!ctm) return;
      const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
      let best = null, far = REACH / Math.hypot(ctm.a, ctm.b);
      for (const d of dots) {
        if (d.el.style.display === "none") continue;
        const gap = Math.hypot(+d.el.getAttribute("cx") - p.x, +d.el.getAttribute("cy") - p.y);
        if (gap < far) { far = gap; best = d.node; }
      }
      if (best !== null) {
        moveTo(best, false);
        pick(best);
      }
    });

    // The steps, in the words the desktop app's list uses (its spec 030), each
    // name as the map writes it: built as text, never as markup, since every
    // name is the feed's.
    const sentence = s => s.charAt(0).toUpperCase() + s.slice(1) + ".";
    const lineList = labels => labels.map(display).join(", ");
    tripPanel = {
      show() {
        const t = tripAnswer;
        note.textContent = after.textContent = steps.textContent = "";
        if (pickFrom !== null) {
          note.textContent = "From " + nameOf(pickFrom) + ". Pick where the trip ends.";
        } else if (t && t.legs) {
          t.legs.forEach((leg, i) => {
            const item = document.createElement("li");
            item.textContent = "At " + nameOf(leg.board) + ", " + (i ? "change to" : "board")
              + " the " + display(leg.line) + " towards " + nameOf(leg.towards) + ". Ride "
              + leg.stops + (leg.stops === 1 ? " stop" : " stops") + " to " + nameOf(leg.alight)
              + (i === t.legs.length - 1 ? " and get off." : ".");
            steps.appendChild(item);
          });
          after.textContent = [t.reason ? sentence(t.reason) : "",
            t.hidden ? "Avoids the lines you hid: " + lineList(t.hidden) + "." : ""]
            .filter(Boolean).join(" ");
        } else if (t) {
          note.textContent = sentence(t.reason)
            + (t.hidden ? " The lines you hid: " + lineList(t.hidden) + "." : "");
        }
        note.hidden = !note.textContent;
        steps.hidden = !steps.childElementCount;
        after.hidden = !after.textContent;
        panel.hidden = pickFrom === null && !t;
      },
    };
  }

  // ---------------------------------------------------------- the title card
  // The seam's setCard (engine issue 44): the card in the markup, its words put
  // there by present.js from the address, shown or hidden in one step. The
  // document carries it too, so the stylesheet can hide the overlay under it.
  const cardEl = document.getElementById("present-card");
  let carded = false;
  function setCard(on) {
    carded = !!on;
    cardEl.hidden = !carded;
    if (carded) document.documentElement.setAttribute("data-card", "");
    else document.documentElement.removeAttribute("data-card");
  }

  // ------------------------------------------------------------- the draw-in
  // The seam's setDrawn (engine issue 44): the network drawing itself in, from
  // nothing at 0 to the map at 1, as a capture steps the fraction a frame at a time.
  //
  //   The lines shown draw in the order they are stacked in (#lines, the map's
  //   line order), each over half the fraction, their starts spread evenly over
  //   the other half: line k of n is at p = (f - k * 0.5 / (n - 1)) / 0.5, held
  //   to 0..1, and a line alone is at p = f. Linear, so pens that overlap move at
  //   one speed. A line starts at its spine's first end (linear.spine, where its
  //   row starts) and spreads along its own tracks, so a branch starts at its
  //   junction; a piece the start cannot reach (NYC's shuttles) starts at its own
  //   first node, at the line's start. A line's pen at p is p times its reach,
  //   the farthest any of its tracks ends from where it starts.
  //
  //   A track is drawn from its nearer end, as one dash: pathLength 1, so the
  //   dash is a share of the track and holds through any morph, a dasharray of
  //   1 1 and an offset of 1 - q from its src end or q - 1 from its dst end. A
  //   track the pen has not reached is hidden by a class. A station, its rings
  //   and its names appear whole at the first pen that reaches it. The trains
  //   and the clock hold until the network is whole.
  //
  // The distances are measured once, when a draw-in starts, in the view then
  // showing. At 1 every dash and every mark goes, so the network is the map it
  // was. The rows and the chart do not draw in, so there the network shows whole
  // (export.plan refuses a draw-in on either). Under reduced motion a page that
  // nobody is capturing shows it whole as well; a capture draws what it asks
  // for, so an export is the same from any machine.
  const UNDRAWN = "undrawn";
  const DASH = ["pathLength", "stroke-dasharray", "stroke-dashoffset"];
  let drawPlan = null;       // the shown lines' tracks and stations, while drawing
  // Every dot and name of a station, whichever line's they are.
  const stationEls = new Map();
  for (const s of dots.concat(texts)) {
    if (!stationEls.has(s.node)) stationEls.set(s.node, []);
    stationEls.get(s.node).push(s.el);
  }
  // The fraction showing, which is what was asked unless nothing is to move.
  const drawnNow = () =>
    (drawAsked >= 1 || mode !== "map" || (quietFade && !capture) ? 1 : drawAsked);
  const hide = el => el.classList.add(UNDRAWN);
  const unhide = el => {
    if (!el.classList.contains(UNDRAWN)) return;
    el.classList.remove(UNDRAWN);
    if (!el.classList.length) el.removeAttribute("class");
  };

  function planDrawn() {
    const m = ease(view), g = ease(geo);
    // A track's length as trackD draws it in the view now showing.
    const lengthOf = t => {
      const a = linXY(t.label, t.src), b = linXY(t.label, t.dst);
      const n = t.pts.length - 1;
      let total = 0, x0 = 0, y0 = 0;
      for (let i = 0; i <= n; i++) {
        let px = t.pts[i].x, py = t.pts[i].y;
        if (g > 0 && t.gpts) { px = lerp(px, t.gpts[i].x, g); py = lerp(py, t.gpts[i].y, g); }
        if (m > 0 && a && b) {
          const f = n === 0 ? 0 : i / n;
          px = lerp(px, lerp(a.x, b.x, f), m);
          py = lerp(py, lerp(a.y, b.y, f), m);
        }
        if (i) total += Math.hypot(px - x0, py - y0);
        x0 = px; y0 = py;
      }
      return total;
    };
    const lines = [];
    const nodes = new Set();         // every node of a shown line
    svg.querySelectorAll("#lines g.line").forEach(group => {
      const label = group.getAttribute("data-line");
      const own = tracks.filter(t => t.label === label);
      if (hidden.has(label) || !own.length) return;
      const lens = own.map(lengthOf);
      const next = new Map();        // node -> [{ to, len }]
      own.forEach((t, i) => {
        if (t.src === t.dst) return;
        for (const [a, b] of [[t.src, t.dst], [t.dst, t.src]]) {
          if (!next.has(a)) next.set(a, []);
          next.get(a).push({ to: b, len: lens[i] });
        }
      });
      // Shortest distances along the line's own tracks, from a start at 0; a
      // later start is a piece no earlier one reached.
      const dist = new Map();
      const reach = start => {
        if (dist.has(start)) return;
        dist.set(start, 0);
        const open = [start];
        while (open.length) {
          let k = 0;
          for (let i = 1; i < open.length; i++) if (dist.get(open[i]) < dist.get(open[k])) k = i;
          const here = open.splice(k, 1)[0];
          for (const e of next.get(here) || []) {
            const d = dist.get(here) + e.len;
            if (dist.has(e.to) && dist.get(e.to) <= d) continue;
            if (!dist.has(e.to)) open.push(e.to);
            dist.set(e.to, d);
          }
        }
      };
      const row = layout.lines.find(l => l.label === label);
      for (const r of row ? row.rows : []) if (r.nodes.length) reach(r.nodes[0][0]);
      for (const t of own) reach(t.src);
      const line = { reach: 0, tracks: [] };
      own.forEach((t, i) => {
        const ds = dist.get(t.src), dd = dist.get(t.dst);
        const start = Math.min(ds, dd);
        const fromSrc = ds <= dd;
        line.tracks.push({ el: t.el, len: lens[i], start: start, fromSrc: fromSrc, q: null,
                           near: fromSrc ? t.src : t.dst, far: fromSrc ? t.dst : t.src });
        line.reach = Math.max(line.reach, start + lens[i]);
      });
      for (const node of dist.keys()) nodes.add(node);
      lines.push(line);
    });
    return { lines: lines, nodes: nodes, reached: new Map() };
  }

  // The share of a track drawn is written to six places, so a share closer to
  // 0 or 1 than that is drawn as none or all: never a dash of nothing.
  const WHOLE = 1e-6;
  function markDrawn(f) {
    const n = drawPlan.lines.length;
    const reached = new Set();
    drawPlan.lines.forEach((line, k) => {
      const p = n > 1 ? Math.min(1, Math.max(0, (f - k * 0.5 / (n - 1)) / 0.5)) : f;
      const pen = p * line.reach;
      for (const tr of line.tracks) {
        let q = tr.len > 0 ? (pen - tr.start) / tr.len : (pen > tr.start ? 1 : 0);
        q = q >= 1 - WHOLE ? 1 : q <= WHOLE ? 0 : q;
        const el = tr.el;
        if (q === 0 || q === 1) {
          if (q !== tr.q) {
            if (q === 0) hide(el); else unhide(el);
            for (const name of DASH) el.removeAttribute(name);
          }
        } else {
          if (!(tr.q > 0 && tr.q < 1)) {
            unhide(el);
            el.setAttribute("pathLength", "1");
            el.setAttribute("stroke-dasharray", "1 1");
          }
          el.setAttribute("stroke-dashoffset", (tr.fromSrc ? 1 - q : q - 1).toFixed(6));
        }
        tr.q = q;
        // A station is reached once a drawn stroke touches it.
        if (q > 0) reached.add(tr.near);
        if (q === 1) reached.add(tr.far);
      }
    });
    for (const node of drawPlan.nodes) {
      const on = reached.has(node);
      if (drawPlan.reached.get(node) === on) continue;
      drawPlan.reached.set(node, on);
      for (const el of stationEls.get(node) || []) {
        if (on) unhide(el); else hide(el);
      }
    }
  }

  function unmarkDrawn() {
    for (const t of tracks) {
      unhide(t.el);
      for (const name of DASH) t.el.removeAttribute(name);
    }
    for (const els of stationEls.values()) for (const el of els) unhide(el);
    svg.classList.remove("drawing");
    if (!svg.classList.length) svg.removeAttribute("class");
  }

  // Brings the marks to the fraction showing. At 1 it takes every one away and
  // has the next frame lay the drawing out again, which repaints it whole: a
  // repaint only where marks had been left crossing strokes up to 10 levels off
  // the plain map's, and this way the finished network is that map to the pixel.
  function showDrawn() {
    const f = drawnNow();
    if (f >= 1) {
      if (drawing) { unmarkDrawn(); dirty = true; }
      drawing = false;
      drawPlan = null;
      return;
    }
    if (!drawPlan) drawPlan = planDrawn();
    if (!drawing) svg.classList.add("drawing");
    drawing = true;
    markDrawn(f);
  }
  function replanDrawn() {
    unmarkDrawn();
    drawing = false;
    drawPlan = null;
    showDrawn();
  }
  function setDrawn(fraction) {
    // A number alone counts: null and an empty string would read as 0 through
    // Number() and draw bare ground, where a missing value means the map.
    const f = typeof fraction === "number" ? fraction : NaN;
    drawAsked = Number.isNaN(f) ? 1 : Math.min(1, Math.max(0, f));
    showDrawn();
    draw();
  }

  describeMap();
  setMode("map");
  setMore(window.innerWidth > 900);
  addEventListener("resize", () => { dirty = true; });
  geometry(0, 0, 0);

  // The mechanism an exporter drives. Everything above is closed over inside
  // this IIFE, so a second <script> cannot reach it; this object is the only
  // seam. It is deliberately mechanism, not policy -- the storyboard, the URL
  // parameters and the overlay all live outside and talk only through here.
  // The box that holds only what is still showing, across every state the
  // figure will pass through. Measured off the drawing rather than computed
  // from the data, because a label's box is its rendered text and only the
  // browser knows how wide that is.
  //
  // Static, not per-frame: it is sampled at the three extremes and unioned, so
  // the frame stays put while the network moves inside it. Recomputing every
  // frame would work, but the box would then drift the whole way through a
  // morph, which reads as an unasked-for camera move.
  function fitVisible() {
    fittedEarly = fontsPending();
    const els = [];
    svg.querySelectorAll("#lines g.line").forEach(g => els.push(g));
    for (const d of dots) els.push(d.el);
    for (const t of texts) els.push(t.el);

    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const measure = () => {
      for (const el of els) {
        if (el.style.display === "none") continue;
        let b;
        try { b = el.getBBox(); } catch (e) { continue; }
        if (!b || (!b.width && !b.height)) continue;
        x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
        x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
      }
    };

    const reset = () => { x0 = y0 = Infinity; x1 = y1 = -Infinity; };
    const taken = () => {
      if (!(x1 > x0 && y1 > y0)) return null;
      const pad = Math.max(x1 - x0, y1 - y0) * 0.03;
      return [x0 - pad, y0 - pad, (x1 - x0) + 2 * pad, (y1 - y0) + 2 * pad];
    };

    const wasView = view, wasStr = str, wasGeo = geo;
    subsetBox = subsetLinBox = null;        // measure against the drawn box
    reset();
    geometry(0, 0, 0); measure();                    // the schematic map
    if (geoData) { geometry(0, 0, 1); measure(); }   // ...and on the ground
    const netBox = taken();
    reset();
    geometry(1, 0, 0); measure();                    // unfolded into rows
    const linBox = taken();
    geometry(ease(wasView), ease(wasStr), ease(wasGeo));

    if (!netBox || !linBox) return;
    subsetBox = netBox;
    subsetLinBox = linBox;
    dirty = true;
    draw();
  }

  // The theme now showing, by the names the boot script at the top of the page
  // and the site's theme.js use: sepia is the one attribute value there is, and
  // warm-dark is the page with none.
  const themeName = () =>
    document.documentElement.getAttribute("data-theme") === "sepia" ? "sepia" : "warm-dark";

  window.__present = {
    advance(dt) { advance(dt); draw(); },
    seek(sec) { now = Math.max(t0, Math.min(t1, sec)); dirty = true; draw(); },
    setCapture(on) {
      capture = on;
      if (on) {
        if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        last = performance.now();
        rafId = requestAnimationFrame(frame);
      }
      // A trip on show leaves the map whole for as long as a capture runs.
      if (tripAsked) showTrip();
      // Reduced motion shows the network whole, but never to a capture.
      if (drawAsked < 1) showDrawn();
    },
    setPlaying(on) { setPlaying(on); },
    setSpeed(x) { speed = x; },
    // setView and setGeo are the two axes, unchanged and independent:
    // bin/_record.js raises geo and *then* names a view, so a setView that
    // lowered geo by itself would break every geographic export.
    setView(v, dur) { setMode(v, dur); },
    setGeo(on, dur) { return setGeo(on, dur); },
    // Both axes at once, by the public name of the view. This is what the
    // site's switcher drives, and what the page's own buttons go through.
    showView(name, dur) { showView(name, dur); },
    hasGeo() { return !!geoData; },
    setLabels(on) { setLabels(on); },
    setRoutes(keep) {
      for (const r of routes) setLineShown(r, !keep || keep.indexOf(r) >= 0);
      answerTripAgain();
      // Showing everything again means the drawn box is right again.
      if (hidden.size) fitVisible();
      else { subsetBox = subsetLinBox = null; dirty = true; }
      draw();
    },
    setFrame(aspect, top, margin) {
      frameAspect = aspect || 0;
      if (typeof top === "number") frameTop = top;
      if (typeof margin === "number") frameMargin = margin;
      dirty = true; draw();
    },
    // The page's theme, changed in place: the clock, the view, the scrub
    // position and the line toggles stay where they are, because everything a
    // theme touches is a CSS variable the stylesheet already swaps on
    // data-theme. It sets that attribute the way the boot script and the
    // site's theme.js do -- sepia sets it, warm-dark removes it -- and, like a
    // no-op setGeo, reports false for a name the page does not know and
    // changes nothing. It never writes the rc-theme key, which the site's
    // script owns, and nothing calls it on load, so an address's ?theme= still
    // wins at boot and a captured frame is the one it always was.
    setTheme(name) {
      if (name !== "warm-dark" && name !== "sepia") return false;
      const root = document.documentElement;
      if (name === "sepia") root.setAttribute("data-theme", "sepia");
      else root.removeAttribute("data-theme");
      return true;
    },
    // Snap every tween to its target: a still should never catch a transition
    // halfway through. Answers a promise that resolves once every face the
    // page declares has loaded: the map's embedded face (engine issue 76) is a
    // data URI decoded after the first pass, and a frame taken before it draws
    // the names in the fallback face. A box fitted to the showing lines while
    // the face was loading is fitted again once it is in, at once when it
    // already is. The snap itself happens before this returns, as it always
    // did, and a page that embeds no face is never fitted again.
    settle() {
      view = viewTarget; str = strTarget; geo = geoTarget;
      viewTween = strTween = geoTween = null;
      for (const entry of rowTarget) rowPos.set(entry[0], entry[1]);
      stepFade(0, true);
      dirty = true; draw();
      const refit = () => { if (fittedEarly && hidden.size && !fontsPending()) fitVisible(); };
      refit();
      if (!document.fonts) return Promise.resolve();
      return Promise.all(Array.from(document.fonts, f => f.load().catch(() => null)))
        .then(() => document.fonts.ready)
        .then(refit);
    },
    bounds() { return { t0: t0, t1: t1 }; },
    onDraw(fn) { onDraw = fn; },
    // `trip` is null, or what setTrip last answered; `changePenalty` is the
    // stops a change costs a trip. `card` is whether the title card is up and
    // `drawn` the share of the network showing, 1 when it is whole.
    state() {
      return { now: now, clock: fmt(now), shown: shown, mode: mode,
               view: view, str: str, geo: geo, box: lastBox.slice(),
               viewName: viewName(), labels: labelsOn, theme: themeName(),
               trip: tripCopy(), changePenalty: CHANGE_PENALTY,
               card: carded, drawn: drawnNow() };
    },
    // A trip between two stations, by the ids map.build's `stations` lists:
    // everything keyed to a line it does not ride fades and every station
    // name off it is hidden, unless an exporter is driving the page. Answers
    // what state().trip then says: the legs, or `legs: null` and a reason,
    // with the map left whole. setTrip(null) shows the whole network again.
    setTrip(from, to) { return setTrip(from, to); },
    // The title card over the frame, or none: the city, the network, the
    // service day and the caption the address carries, on a scrim of the
    // ground. It cuts in and out.
    setCard(on) { setCard(on); },
    // The network drawn in to a fraction from 0 to 1, held to that range: 0 is
    // the bare ground, 1 the map with nothing of the draw-in left on it.
    setDrawn(fraction) { setDrawn(fraction); },
  };
  __PRESENT__
  rafId = requestAnimationFrame(frame);
})();
</script>
</html>
